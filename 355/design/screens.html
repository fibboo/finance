<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deleted accounts in transactions</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>
  .srOnly { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.struck { text-decoration: line-through; text-decoration-color: var(--color-muted); color: var(--color-muted); }
  .accountLink { color: inherit; text-decoration: none; }
  .accountLink::after { content: ' ›'; color: var(--color-muted); }
  .accountLink:hover { text-decoration: underline; }

  .page { color: var(--color-ink); background: var(--color-ground); min-height: 100vh; }
  .pageTitle { margin: 0; font-size: var(--font-size-3xl); font-weight: var(--font-weight-semibold); letter-spacing: var(--letter-spacing-title); }
  .count { margin-left: var(--space-2); font-size: var(--font-size-heading); color: var(--color-muted); font-weight: var(--font-weight-medium); }

  .desktop { width: 1280px; padding: var(--space-6); }
  .desktop .layout { display: grid; grid-template-columns: minmax(0, 1fr) 30rem; gap: var(--space-4); margin-top: var(--space-4); align-items: start; }
  .desktop .details { background: var(--color-panel); border-radius: var(--radius-panel); padding: var(--space-6); }

  .phonePage { width: 390px; padding: var(--space-4); position: relative; overflow: hidden; }
  .phonePage .panel { margin-top: var(--space-3); padding: var(--space-3) var(--space-3-5); }
  .backdrop { position: absolute; inset: 0; background: var(--color-backdrop); }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--color-panel); border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
    padding: var(--space-2) var(--space-4) var(--space-6);
  }
  .handle { width: var(--size-sheet-handle); height: var(--size-sheet-handle-thickness); border-radius: var(--radius-full); background: var(--color-border); margin: 0 auto var(--space-3); }
  .phonePage .bigAmount { font-size: var(--font-size-3xl); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const params = new URLSearchParams(location.search);
  const screen = params.get('screen') ?? 'transactions-desktop';
  document.documentElement.style.colorScheme = params.get('theme') ?? 'dark';

  const struck = (name) => `<span class="struck">${name}<span class="srOnly">, deleted</span></span>`;

  function rowsFor() {
    return {
      today: [
        { kind: 'adjustment', color: '#2bb07f', wide: `<span class="wide">Adjustment · ${struck('Savings')}</span>`, orig: '-₾41,571.52', amount: '-$16,507.00', rate: '2.5184' },
        { kind: '', color: '#4b8fd6', title: 'Groceries', accounts: `<span class="accounts">${struck('Wallet 2')}</span>`, amount: '-$42.10' },
        { kind: 'transfer', color: '#4b8fd6', wide: `<span class="wide">Transfer ${struck('Wallet 2')} → Wallet</span>`, amount: '$389.10', selected: true },
        { kind: '', color: '#4b8fd6', title: 'Coffee', accounts: '<span class="accounts">Wallet</span>', amount: '-$4.50' },
        { kind: 'income', color: '#6b6fe0', title: 'Salary', accounts: '<span class="accounts">Main card</span>', orig: '+€3,000.00', amount: '+$3,510.00', rate: '0.8547', income: true },
      ],
      yesterday: [
        { kind: '', color: '#6b6fe0', title: 'Rent', accounts: '<span class="accounts">Main card</span>', orig: '-€900.00', amount: '-$1,053.00', rate: '0.8547' },
        { kind: 'adjustment', color: '#2bb07f', wide: '<span class="wide">Adjustment · Crypto</span>', amount: '-$550.00' },
      ],
    };
  }

  function row(r) {
    const titleCells = r.wide ?? `<span class="title">${r.title}</span>${r.accounts}`;
    return `<div class="row ${r.kind} ${r.selected ? 'selected' : ''}"><span class="dot" style="color:${r.color}"></span>${titleCells}<span class="orig">${r.orig ?? ''}</span><span class="amount ${r.income ? 'in' : ''}">${r.amount}</span><span class="rate">${r.rate ?? ''}</span></div>`;
  }

  function list(isPhone) {
    const rows = rowsFor();
    return `<div class="list ${isPhone ? 'phone' : ''}">
      <div class="columns"><span></span><span>Transaction</span><span>Account</span><span class="r">Original</span><span class="r">Amount</span><span class="r">${isPhone ? '' : 'Rate'}</span></div>
      <div class="dayHeader"><b>Today</b><span>-$13,043.60</span></div>
      ${rows.today.map(row).join('')}
      <div class="dayHeader"><b>Sun, 08.11.2026</b><span>-$1,603.00</span></div>
      ${rows.yesterday.map(row).join('')}
    </div>`;
  }

  const details = `<div class="details">
      <div class="dHeader">
        <div>
          <div class="meta">Transfer · Mon, 09.11.2026</div>
          <h2 class="dTitle">Transfer ${struck('Wallet 2')} → Wallet</h2>
        </div>
        <span class="close">×</span>
      </div>
      <div><div class="bigAmount">$389.10</div></div>
      <div class="postings">
        <p class="postingsTitle">Postings</p>
        <div class="posting"><span class="dot" style="color:#4b8fd6"></span><span class="account"><span><a class="accountLink" href="#">Wallet</a></span><span class="note">Asset · USD</span></span><span class="amounts">+$389.10</span></div>
        <div class="posting"><span class="dot" style="color:#4b8fd6"></span><span class="account"><span>${struck('Wallet 2')}</span><span class="note">Asset · USD</span></span><span class="amounts">-$389.10</span></div>
      </div>
      <div class="deleteBtn">Delete transaction</div>
    </div>`;

  const root = document.getElementById('root');
  if (screen === 'transactions-desktop') {
    root.innerHTML = `<div class="page desktop">
      <h1 class="pageTitle">Transactions<span class="count">-$14,646.60</span></h1>
      <div class="layout"><div class="panel">${list(false)}</div>${details}</div>
    </div>`;
  } else if (screen === 'transactions-phone') {
    root.innerHTML = `<div class="page phonePage"><h1 class="pageTitle">Transactions</h1><div class="panel">${list(true)}</div></div>`;
  } else {
    root.innerHTML = `<div class="page phonePage"><h1 class="pageTitle">Transactions</h1><div class="panel">${list(true)}</div>
      <div class="backdrop"></div><div class="sheet"><div class="handle"></div>${details}</div></div>`;
  }
</script>
</body>
</html>

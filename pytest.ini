[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
env =
    ENVIRONMENT=local
    APP_TITLE=Finance API
    PUBLIC_BASE_URL=https://api.finance.test
    ALLOWED_REDIRECT_URIS=["https://finance.test/auth/callback"]
    ALLOWED_ORIGINS=["https://finance.test"]
    JWT_SECRET=fake_jwt_secret_of_at_least_32_bytes
    ACCESS_TOKEN_EXPIRE_SECONDS=900
    REFRESH_TOKEN_EXPIRE_SECONDS=2592000

    DATABASE_URL=postgresql+asyncpg://fake_user:fake_password@localhost:5432/fake_database

    TELEGRAM_CLIENT_ID=123456789
    TELEGRAM_CLIENT_SECRET=fake_telegram_client_secret

    GOOGLE_CLIENT_ID=fake_google_client_id.apps.googleusercontent.com
    GOOGLE_CLIENT_SECRET=fake_google_client_secret

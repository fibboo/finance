<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding loading — split desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.8}
button,input{font:inherit}
button{cursor:pointer}
.sk{display:block;background-repeat:no-repeat;background-size:200% 100%;animation:sk-shimmer 1.4s ease-in-out infinite}
.sk-light{background-image:linear-gradient(90deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.65) 50%,rgba(255,255,255,0) 70%)}
.sk-dark{background-image:linear-gradient(90deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.07) 50%,rgba(255,255,255,0) 70%)}
@keyframes sk-shimmer{from{background-position:150% 0}to{background-position:-50% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none;background-image:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 16px; display: grid; grid-template-columns: 5fr 7fr; gap: 16px; font-family: Geist, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <section style="padding: 40px 48px; border-radius: 22px; display: flex; flex-direction: column; background: {{t.panel}}">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px">
        <span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.accent}}"></span>
        finance
      </div>
      <button type="button" style="height: 44px; padding: 0 4px; border: 0; background: transparent; font-size: 14px; color: {{t.muted}}">Sign out</button>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px">
      <h1 style="margin: 0; font-size: 40px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em">Pick your base currency</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.5; color: {{t.muted}}">Totals and monthly summaries are counted in it. We’ll open a Wallet in this currency.</p>
    </div>
    <p style="margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.4; color: {{t.muted}}">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
      The base currency can’t be changed later. Accounts in other currencies can be added any time.
    </p>
  </section>
  <main aria-busy="true" style="padding: 24px; border-radius: 22px; display: flex; flex-direction: column; gap: 16px; min-height: 0; background: {{t.panel}}">
    <span aria-hidden="true" class="{{sk}}" style="height: 48px; flex-shrink: 0; border-radius: 12px; background-color: {{t.bg}}"></span>
    <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 52px; gap: 6px; align-content: start">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 12px; padding: 0 14px; border-radius: 12px; background: {{t.bg}}"><span aria-hidden="true" class="{{sk}}" style="width: 36px; height: 12px; flex-shrink: 0; border-radius: 6px; background-color: {{t.bone}}"></span><span aria-hidden="true" class="{{sk}}" style="width: {{r.name}}; height: 12px; border-radius: 6px; background-color: {{t.bone}}"></span></div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: flex-end">
      <span aria-hidden="true" class="{{sk}}" style="width: 220px; height: 52px; border-radius: 14px; background-color: {{t.boneStrong}}"></span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', accent: '#1F7A55', sel: '#EAF3EE', bone: '#E4E4E0', boneStrong: '#E4E4E0' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', accent: '#4CC38A', sel: '#16241D', bone: '#24272B', boneStrong: '#24272B' };
const t = (this.props.dark ?? true) ? D : L;
const dark = this.props.dark ?? true;
const rows = ['72px', '96px', '112px', '84px', '104px', '88px'].map((name) => ({ name }));
return { t, sk: 'sk ' + (dark ? 'sk-dark' : 'sk-light'), rows };
}
}
</script>
</body>
</html>

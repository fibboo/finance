<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in loading — split desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.8}
button{font:inherit;cursor:pointer}
.sk{display:block;background-repeat:no-repeat;background-size:200% 100%;animation:sk-shimmer 1.4s ease-in-out infinite}
.sk-light{background-image:linear-gradient(90deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.65) 50%,rgba(255,255,255,0) 70%)}
.sk-dark{background-image:linear-gradient(90deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.07) 50%,rgba(255,255,255,0) 70%)}
@keyframes sk-shimmer{from{background-position:150% 0}to{background-position:-50% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none;background-image:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; font-family: Geist, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <section style="padding: 40px 48px; border-radius: 22px; display: flex; flex-direction: column; background: {{t.panel}}">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px; letter-spacing: -0.01em">
      <span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.accent}}"></span>
      finance
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; max-width: 480px">
      <h1 style="margin: 0; font-size: 56px; line-height: 1.05; font-weight: 600; letter-spacing: -0.035em">Every coin<br>on the record.</h1>
      <p style="margin: 0; font-size: 18px; line-height: 1.5; color: {{t.muted}}">Accounts, spending and income across currencies, in one quiet place.</p>
    </div>
  </section>
  <main aria-busy="true" style="display: flex; align-items: center; justify-content: center">
    <div style="width: 360px; display: flex; flex-direction: column; gap: 10px">
      <span aria-hidden="true" class="{{sk}}" style="height: 52px; border-radius: 12px; background-color: {{t.bone}}"></span>
      <span aria-hidden="true" class="{{sk}}" style="height: 52px; border-radius: 12px; background-color: {{t.bone}}"></span>
      <p style="margin: 8px 0 0; text-align: center; font-size: 13px; color: {{t.muted}}">First sign-in creates your account.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5E6168', line: '#E2E2DE', accent: '#1F7A55', bone: '#E0E0DB' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', line: '#2A2D32', accent: '#4CC38A', bone: '#1C1F22' };
const dark = this.props.dark ?? true;
return { t: dark ? D : L, sk: 'sk ' + (dark ? 'sk-dark' : 'sk-light') };
}
}
</script>
</body>
</html>

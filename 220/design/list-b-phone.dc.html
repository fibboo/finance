<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accounts in tabs with tiles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.8}
button,input{font:inherit}
button{cursor:pointer}
input::placeholder{color:inherit;opacity:.7}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 12px 12px 96px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; font-family: Geist, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Accounts <span style="font-weight: 500; color: {{t.muted}}">7</span></h1>
    <button type="button" aria-label="Open account menu" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 999px; font-size: 14px; font-weight: 600; background: {{t.panel}}; color: {{t.text}}">FI</button>
  </div>
  <div role="tablist" aria-label="Kind" style="padding: 4px; border-radius: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: {{t.panel}}">
    <button type="button" role="tab" aria-selected="true" style="height: 52px; border: 0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: {{t.bone}}; color: {{t.text}}">
      <span style="font-size: 14px; font-weight: 600">Assets</span>
      <span style="font-size: 13px; color: {{t.muted}}">$94,344.46</span>
    </button>
    <button type="button" role="tab" aria-selected="false" style="height: 52px; border: 0; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; color: {{t.muted}}">
      <span style="font-size: 14px; font-weight: 600">Liabilities</span>
      <span style="font-size: 13px; color: {{t.danger}}">−$1,769.60</span>
    </button>
  </div>
  <div style="display: flex; gap: 8px">
    <label style="flex: 1; height: 44px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 8px; background: {{t.panel}}; color: {{t.muted}}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input type="search" placeholder="Search accounts" style="flex: 1; min-width: 0; border: 0; padding: 0; background: transparent; font-size: 15px; color: {{t.text}}; outline: none">
    </label>
    <button type="button" aria-label="New account" style="width: 44px; height: 44px; border: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{t.text}}; color: {{t.bg}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{assets}}" as="a" hint-placeholder-count="5">
      <a href="details-phone.dc.html" style="padding: 12px; border-radius: 16px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; background: {{t.panel}}">
        <span style="display: flex; align-items: center; gap: 8px">
          <span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: {{a.color}}; background: {{a.tint}}">{{a.initial}}</span>
          <span style="display: flex; flex-direction: column">
            <span style="font-size: 15px; font-weight: 500">{{a.name}}</span>
            <span style="font-size: 12px; color: {{t.muted}}">{{a.currency}}</span>
          </span>
        </span>
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 17px; font-weight: 700">{{a.base}}</span>
          <span style="font-size: 13px; min-height: 18px; color: {{t.muted}}">{{a.own}}</span>
        </span>
      </a>
    </sc-for>
  </div>
  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 60px; border-radius: 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: {{t.panel}}; border: 1px solid {{t.border}}; font-size: 12px; font-weight: 600">
    <a href="#" style="text-align: center; text-decoration: none; color: {{t.muted}}">Home</a>
    <a href="#" style="text-align: center; text-decoration: none; color: {{t.muted}}">Transactions</a>
    <button type="button" aria-label="Add transaction" style="justify-self: center; width: 46px; height: 46px; border: 0; border-radius: 16px; font-size: 22px; background: {{t.bone}}; color: {{t.text}}">+</button>
    <a href="#" aria-current="page" style="text-align: center; text-decoration: none; color: {{t.text}}">Accounts</a>
    <a href="#" style="text-align: center; text-decoration: none; color: {{t.muted}}">Categories</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', accent: '#1F7A55', border: '#E2E2DE', danger: '#B42318', bone: '#E4E4E0' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', accent: '#4CC38A', border: '#2A2D32', danger: '#FF7A6B', bone: '#24272B' };
const mark = (name, color) => ({ initial: name[0], color, tint: color + '2E' });
const assets = [
  { name: 'Main card', currency: 'EUR', base: '$57,442.02', own: '€49,095.74', ...mark('Main card', '#5B6CD9') },
  { name: 'Savings', currency: 'GEL', base: '$16,507.00', own: '₾41,556.56', ...mark('Savings', '#2E8C7A') },
  { name: 'Freelance', currency: 'USD', base: '$16,282.76', own: '', ...mark('Freelance', '#A15CB8') },
  { name: 'Wallet', currency: 'USD', base: '$2,107.23', own: '', ...mark('Wallet', '#4D8FBF') },
  { name: 'Dinar card', currency: 'RSD', base: '$2,005.45', own: 'RSD 200,186', ...mark('Dinar card', '#B8862C') }
];
return { t: (this.props.dark ?? true) ? D : L, assets };
}
}
</script>
</body>
</html>

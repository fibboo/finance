<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delete account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Geist, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 24px; font-weight: 700">Accounts</div>
    <div style="height: 44px; border-radius: 999px; background: {{t.panel}}"></div>
    <div style="height: 340px; border-radius: 20px; background: {{t.panel}}"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.45)"></div>
  <section role="alertdialog" aria-label="Delete Old cash" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 16px 20px; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; gap: 16px; background: {{t.panel}}">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: {{t.border}}"></span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700">Delete Old cash?</h2>
      <p style="margin: 0; font-size: 15px; line-height: 1.45; color: {{t.muted}}">Its balance is zero. The account leaves the lists and pickers; its transactions stay in the history.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 48px; border: 1px solid {{t.border}}; border-radius: 14px; font-size: 15px; font-weight: 600; background: transparent; color: {{t.text}}">Keep</button>
      <button type="button" style="height: 48px; border: 0; border-radius: 14px; font-size: 15px; font-weight: 600; background: {{t.danger}}; color: {{t.onDanger}}">Delete</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', border: '#E2E2DE', danger: '#B42318', onDanger: '#FFFFFF' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', border: '#2A2D32', danger: '#FF7A6B', onDanger: '#0B0C0E' };
return { t: (this.props.dark ?? true) ? D : L };
}
}
</script>
</body>
</html>

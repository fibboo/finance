<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adjust balance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.8}
button,input{font:inherit}
button{cursor:pointer}
input::placeholder{color:inherit;opacity:.6}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Geist, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 24px; font-weight: 700">Accounts</div>
    <div style="height: 44px; border-radius: 999px; background: {{t.panel}}"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.45)"></div>
  <form aria-label="Adjust balance" style="position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 8px 16px 20px; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; gap: 16px; background: {{t.panel}}">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 999px; background: {{t.border}}"></span>
    <div style="display: flex; align-items: flex-start; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: {{t.muted}}">Lari cash · GEL</span>
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">Adjust balance</h2>
      </div>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; margin: -6px -10px 0 0; border: 0; background: transparent; color: {{t.muted}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <div style="padding: 12px 14px; border-radius: 14px; display: flex; justify-content: space-between; font-size: 15px; background: {{t.bg}}">
      <span style="color: {{t.muted}}">Current balance</span>
      <span style="font-weight: 600">₾0.00</span>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">New balance, GEL</span>
      <input inputmode="decimal" value="1,250.00" style="height: 52px; padding: 0 14px; border: 1px solid {{t.border}}; border-radius: 12px; font-size: 22px; font-weight: 700; background: {{t.bg}}; color: {{t.text}}">
      <span style="font-size: 13px; color: {{t.muted}}">Change +₾1,250.00</span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Value in USD</span>
      <input inputmode="decimal" value="463.30" style="height: 46px; padding: 0 14px; border: 1px solid {{t.border}}; border-radius: 12px; font-size: 16px; background: {{t.bg}}; color: {{t.text}}">
      <span style="font-size: 13px; line-height: 1.4; color: {{t.muted}}">This account has no USD rate yet, so the change needs its value in USD.</span>
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Date</span>
        <input value="01.11.2026" style="height: 46px; padding: 0 14px; border: 1px solid {{t.border}}; border-radius: 12px; font-size: 16px; background: {{t.bg}}; color: {{t.text}}">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Comment</span>
        <input placeholder="Optional" style="height: 46px; padding: 0 14px; border: 1px solid {{t.border}}; border-radius: 12px; font-size: 16px; background: {{t.bg}}; color: {{t.text}}">
      </label>
    </div>
    <button type="submit" style="height: 48px; border: 0; border-radius: 14px; font-size: 16px; font-weight: 600; background: {{t.text}}; color: {{t.bg}}">Save balance</button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', border: '#E2E2DE', danger: '#B42318' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', border: '#2A2D32', danger: '#FF7A6B' };
return { t: (this.props.dark ?? true) ? D : L };
}
}
</script>
</body>
</html>

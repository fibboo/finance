<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accounts with the search and the group header pinned, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.8}
button,input{font:inherit}
button{cursor:pointer}
input::placeholder{color:inherit;opacity:.7}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Geist, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <div style="position: absolute; left: 12px; right: 12px; top: 12px; height: 44px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Accounts <span style="font-weight: 500; color: {{t.muted}}">18</span></h1>
    <button type="button" aria-label="Open account menu" style="width: 44px; height: 44px; padding: 0; border: 0; border-radius: 999px; font-size: 14px; font-weight: 600; background: {{t.panel}}; color: {{t.text}}">FI</button>
  </div>
  <div style="position: absolute; left: 12px; right: 12px; top: 66px; bottom: 84px; overflow: hidden">
    <div style="position: absolute; left: 0; right: 0; top: {{contentTop}}px; display: flex; flex-direction: column; gap: 10px">
      <div style="height: 44px"></div>
      <section aria-label="Assets" style="padding: 0 16px 6px; border-radius: 20px; background: {{t.panel}}">
        <div style="height: 40px; display: flex; align-items: center; justify-content: space-between">
          <h2 style="margin: 0; font-size: 17px; font-weight: 700">Assets</h2>
          <span style="font-size: 15px; font-weight: 600">$96,731.86</span>
        </div>
        <sc-for list="{{assets}}" as="a" hint-placeholder-count="10">
          <a href="#" style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; text-decoration: none; border-top: 1px solid {{t.border}}">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: {{a.color}}; background: {{a.tint}}">{{a.initial}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 16px; font-weight: 500">{{a.name}}</span>
              <span style="font-size: 13px; color: {{t.muted}}">{{a.currency}}</span>
            </span>
            <span style="display: flex; flex-direction: column; align-items: flex-end">
              <span style="font-size: 16px; font-weight: 700">{{a.base}}</span>
              <span style="font-size: 13px; color: {{t.muted}}">{{a.own}}</span>
            </span>
          </a>
        </sc-for>
      </section>
      <section aria-label="Liabilities" style="padding: 0 16px 6px; border-radius: 20px; background: {{t.panel}}">
        <div style="height: 40px; display: flex; align-items: center; justify-content: space-between">
          <h2 style="margin: 0; font-size: 17px; font-weight: 700">Liabilities</h2>
          <span style="font-size: 15px; font-weight: 600; color: {{t.danger}}">−$95,830.14</span>
        </div>
        <sc-for list="{{liabilities}}" as="a" hint-placeholder-count="8">
          <a href="#" style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; text-decoration: none; border-top: 1px solid {{t.border}}">
            <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: {{a.color}}; background: {{a.tint}}">{{a.initial}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <span style="font-size: 16px; font-weight: 500">{{a.name}}</span>
              <span style="font-size: 13px; color: {{t.muted}}">{{a.currency}}</span>
            </span>
            <span style="display: flex; flex-direction: column; align-items: flex-end">
              <span style="font-size: 16px; font-weight: 700; color: {{t.danger}}">{{a.base}}</span>
              <span style="font-size: 13px; color: {{t.muted}}">{{a.own}}</span>
            </span>
          </a>
        </sc-for>
      </section>
      <div style="height: 40px"></div>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: {{headerTop}}px; height: 40px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-radius: {{headerRadius}}; background: {{t.panel}};">
      <span style="font-size: 17px; font-weight: 700">Assets</span>
      <span style="font-size: 15px; font-weight: 600">$96,731.86</span>
    </div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 54px; background: {{t.bg}}">
      <div style="display: flex; gap: 8px">
        <label style="flex: 1; height: 44px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 8px; background: {{t.panel}}; color: {{t.muted}}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input type="search" placeholder="Search accounts" style="flex: 1; min-width: 0; border: 0; padding: 0; background: transparent; font-size: 15px; color: {{t.text}}; outline: none">
        </label>
        <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; background: {{t.text}}; color: {{t.bg}}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New
        </button>
      </div>
    </div>
  </div>
  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 12px; height: 60px; box-sizing: border-box; border-radius: 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: {{t.panel}}; border: 1px solid {{t.border}}; font-size: 12px; font-weight: 600">
    <a href="#" style="text-align: center; text-decoration: none; color: {{t.muted}}">Home</a>
    <a href="#" style="text-align: center; text-decoration: none; color: {{t.muted}}">Transactions</a>
    <button type="button" aria-label="Add transaction" style="justify-self: center; width: 46px; height: 46px; border: 0; border-radius: 16px; font-size: 22px; background: {{t.bone}}; color: {{t.text}}">+</button>
    <a href="#" aria-current="page" style="text-align: center; text-decoration: none; color: {{t.text}}">Accounts</a>
    <a href="#" style="text-align: center; text-decoration: none; color: {{t.muted}}">Categories</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"state":{"editor":"enum","options":["pinned","handoff"],"default":"pinned"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', border: '#E2E2DE', danger: '#B42318', bone: '#E4E4E0' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', border: '#2A2D32', danger: '#FF7A6B', bone: '#24272B' };
const t = (this.props.dark ?? true) ? D : L;
const isHandoff = (this.props.state ?? 'pinned') === 'handoff';
const mark = (color) => ({ color, tint: color + '2E' });
const row = (name, currency, base, own, color) => ({ name, currency, base, own, initial: name[0], ...mark(color) });
const assets = [
  row('Main card', 'EUR', '$57,442.02', '€49,095.74', '#5B6CD9'),
  row('Savings', 'GEL', '$16,507.00', '₾41,556.56', '#2E8C7A'),
  row('Freelance', 'USD', '$16,282.76', '', '#A15CB8'),
  row('Wallet', 'USD', '$2,107.23', '', '#4D8FBF'),
  row('Dinar card', 'RSD', '$2,005.45', 'RSD 200,186', '#B8862C'),
  row('Cash', 'USD', '$940.00', '', '#3E9A5C'),
  row('Travel card', 'EUR', '$612.30', '€523.33', '#2F9BB3'),
  row('Deposit', 'GEL', '$455.10', '₾1,145.70', '#C24E6E'),
  row('Brokerage', 'USD', '$380.00', '', '#4F6D8F'),
  row('Old cash', 'USD', '$0.00', '', '#7A8A99')
];
const liabilities = [
  row('Mortgage', 'USD', '−$84,000.00', '', '#9C7A5B'),
  row('Car loan', 'USD', '−$6,200.00', '', '#D9743A'),
  row('Student loan', 'USD', '−$3,150.00', '', '#6E8A3A'),
  row('Intesa credit', 'EUR', '−$1,451.20', '−€1,240.00', '#8A6FD1'),
  row('Family loan', 'USD', '−$500.00', '', '#C9A227'),
  row('Credit card', 'USD', '−$318.40', '', '#C2613F'),
  row('Overdraft', 'USD', '−$120.55', '', '#B05C9E'),
  row('Store credit', 'USD', '−$89.99', '', '#D07FA8')
];
return {
  t,
  assets,
  liabilities,
  contentTop: isHandoff ? -570 : -308,
  headerTop: isHandoff ? 44 : 54,
  headerRadius: isHandoff ? '0 0 14px 14px' : '0'
};
}
}
</script>
</body>
</html>

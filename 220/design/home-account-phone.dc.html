<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>An account open from Home, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; font-family: Geist, system-ui, sans-serif">
<dc-import name="home-phone" open="{{yes}}" dark="{{dark}}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { dark: this.props.dark ?? true, yes: true, no: false };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accounts in tabs with tiles, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.8}
button,input{font:inherit}
button{cursor:pointer}
input::placeholder{color:inherit;opacity:.7}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 16px; display: flex; gap: 20px; overflow: hidden; font-family: Geist, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <nav aria-label="Main" style="width: 230px; flex: none; padding: 20px 12px; border-radius: 20px; display: flex; flex-direction: column; gap: 6px; background: {{t.panel}}; align-self: flex-start">
    <span style="padding: 0 8px 14px; display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: {{t.accent}}"></span>finance</span>
    <button type="button" style="height: 44px; margin-bottom: 8px; border: 0; border-radius: 14px; font-size: 15px; font-weight: 600; background: {{t.bone}}; color: {{t.text}}">+ Add transaction</button>
    <a href="#" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; font-size: 15px; font-weight: 500; text-decoration: none; color: {{t.muted}}">Home</a>
    <a href="#" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; font-size: 15px; font-weight: 500; text-decoration: none; color: {{t.muted}}">Transactions</a>
    <a href="#" aria-current="page" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none; background: {{t.bg}}; color: {{t.text}}">Accounts</a>
    <span style="height: 44px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; color: {{t.muted}}; opacity: .7">Categories <span style="font-size: 11px; padding: 3px 8px; border-radius: 8px; background: {{t.bg}}">Soon</span></span>
  </nav>
  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px">
    <div style="height: 52px; display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Accounts <span style="font-weight: 500; color: {{t.muted}}">7</span></h1>
      <button type="button" aria-label="Open account menu" style="width: 44px; height: 44px; border: 0; border-radius: 999px; font-size: 14px; font-weight: 600; background: {{t.panel}}; color: {{t.text}}">FI</button>
    </div>
    <div style="display: flex; gap: 8px; align-items: center">
      <div role="tablist" aria-label="Kind" style="padding: 4px; border-radius: 14px; display: flex; gap: 4px; background: {{t.panel}}">
        <button type="button" role="tab" aria-selected="true" style="height: 36px; padding: 0 16px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; background: {{t.bone}}; color: {{t.text}}">Assets <span style="font-weight: 500; color: {{t.muted}}">$94,344.46</span></button>
        <button type="button" role="tab" aria-selected="false" style="height: 36px; padding: 0 16px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; background: transparent; color: {{t.muted}}">Liabilities <span style="font-weight: 500; color: {{t.danger}}">−$1,769.60</span></button>
      </div>
      <label style="width: 280px; height: 44px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 8px; background: {{t.panel}}; color: {{t.muted}}">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input type="search" placeholder="Search accounts" style="flex: 1; min-width: 0; border: 0; padding: 0; background: transparent; font-size: 14px; color: {{t.text}}; outline: none">
      </label>
      <button type="button" style="height: 44px; margin-left: auto; padding: 0 18px; border: 0; border-radius: 999px; font-size: 14px; font-weight: 600; background: {{t.text}}; color: {{t.bg}}">+ New account</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{assets}}" as="a" hint-placeholder-count="5">
        <a href="#" style="padding: 16px; border-radius: 18px; display: flex; flex-direction: column; gap: 14px; text-decoration: none; background: {{t.panel}}">
          <span style="display: flex; align-items: center; gap: 10px">
            <span aria-hidden="true" style="width: 34px; height: 34px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: {{a.color}}; background: {{a.tint}}">{{a.initial}}</span>
            <span style="display: flex; flex-direction: column">
              <span style="font-size: 16px; font-weight: 500">{{a.name}}</span>
              <span style="font-size: 13px; color: {{t.muted}}">{{a.currency}}</span>
            </span>
          </span>
          <span style="display: flex; flex-direction: column">
            <span style="font-size: 20px; font-weight: 700">{{a.base}}</span>
            <span style="font-size: 13px; min-height: 18px; color: {{t.muted}}">{{a.own}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', accent: '#1F7A55', border: '#E2E2DE', danger: '#B42318', bone: '#E4E4E0' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', accent: '#4CC38A', border: '#2A2D32', danger: '#FF7A6B', bone: '#24272B' };
const mark = (name, color) => ({ initial: name[0], color, tint: color + '2E' });
const assets = [
  { name: 'Main card', currency: 'EUR', base: '$57,442.02', own: '€49,095.74', ...mark('Main card', '#5B6CD9') },
  { name: 'Savings', currency: 'GEL', base: '$16,507.00', own: '₾41,556.56', ...mark('Savings', '#2E8C7A') },
  { name: 'Freelance', currency: 'USD', base: '$16,282.76', own: '', ...mark('Freelance', '#A15CB8') },
  { name: 'Wallet', currency: 'USD', base: '$2,107.23', own: '', ...mark('Wallet', '#4D8FBF') },
  { name: 'Dinar card', currency: 'RSD', base: '$2,005.45', own: 'RSD 200,186', ...mark('Dinar card', '#B8862C') }
];
return { t: (this.props.dark ?? true) ? D : L, assets };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transaction details sheet — variant A, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; font-family: Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{t.bg}}; color: {{t.text}}">
  <div style="padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Transactions</span>
    <span style="width: 44px; height: 44px; border-radius: 22px; background: {{t.panel}}"></span>
  </div>
  <div style="height: 40px; border-radius: 999px; background: {{t.panel}}"></div>
  <div style="flex-grow: 1; border-radius: 20px; background: {{t.panel}}"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.35)"></div>
  <div role="dialog" aria-modal="true" aria-labelledby="details-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 16px 16px; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; gap: 16px; background: {{t.panel}}; box-shadow: 0 18px 50px rgba(0,0,0,.3)">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: {{t.line}}"></span>
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: {{t.muted}}">Expense · Wed, Oct 15, 2026</span>
        <h2 id="details-title" style="margin: 0; font-size: 20px; font-weight: 600">Rent</h2>
      </div>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin: -6px -10px 0 0; display: flex; align-items: center; justify-content: center; color: {{t.muted}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 36px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1">−€850.00</span>
      <span style="font-size: 14px; color: {{t.muted}}">≈ $927.90</span>
    </div>
    <section aria-labelledby="postings-title" style="padding: 4px 14px; border-radius: 14px; display: flex; flex-direction: column; background: {{t.bg}}">
      <h3 id="postings-title" style="margin: 0; padding: 10px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: {{t.muted}}">Postings</h3>
      <sc-for list="{{postings}}" as="p" hint-placeholder-count="2">
        <div style="min-height: 52px; display: flex; align-items: center; gap: 12px">
          <span aria-hidden="true" style="{{p.dotStyle}}"></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px">{{p.account}}</span><span style="font-size: 12px; color: {{t.muted}}">{{p.kind}}</span></span>
          <span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 15px; font-weight: 500">{{p.amount}}</span><span style="font-size: 12px; color: {{t.muted}}">{{p.base}}</span></span>
        </div>
      </sc-for>
    </section>
    <dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 16px; row-gap: 10px; font-size: 14px">
      <dt style="color: {{t.muted}}">Location</dt><dd style="margin: 0; text-align: right">Tbilisi, Georgia</dd>
      <dt style="color: {{t.muted}}">Comment</dt><dd style="margin: 0; text-align: right">October, flat on Paliashvili</dd>
    </dl>
    <a href="delete-phone.dc.html" style="height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; background: {{t.bg}}; color: {{t.danger}}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
      Delete transaction
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', accent: '#1F7A55', line: '#E2E2DE', danger: '#B42318' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', accent: '#4CC38A', line: '#2A2D32', danger: '#FF7A6B' };
const t = (this.props.dark ?? true) ? D : L;
const dot = (c) => 'width:8px;height:8px;border-radius:4px;flex-shrink:0;background:' + c;
const postings = [
{ account: 'Main card', kind: 'Money · EUR', amount: '−€850.00', base: '≈ −$927.90', dotStyle: dot('#5B6CD9') },
{ account: 'Rent', kind: 'Category', amount: '+€850.00', base: '≈ +$927.90', dotStyle: dot('#C24E6E') }
];
return { t, postings };
}
}
</script>
</body>
</html>

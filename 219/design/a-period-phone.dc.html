<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Period filter sheet, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; font-family: Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{t.bg}}; color: {{t.text}}">
  <div style="padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Transactions</span>
    <span style="width: 44px; height: 44px; border-radius: 22px; background: {{t.panel}}"></span>
  </div>
  <div style="height: 40px; border-radius: 999px; background: {{t.panel}}"></div>
  <div style="flex-grow: 1; border-radius: 20px; background: {{t.panel}}"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.35)"></div>
  <div role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 16px 16px; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; gap: 12px; background: {{t.panel}}; box-shadow: 0 18px 50px rgba(0,0,0,.3)">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: {{t.line}}"></span>
    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between">
      <h2 id="sheet-title" style="margin: 0; font-size: 18px; font-weight: 600">Period</h2>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center; color: {{t.muted}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    </div>
    <div role="group" aria-label="Presets" style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{periods}}" as="p" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: {{t.muted}}">From<input type="date" value="{{from}}" style="height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid {{t.line}}; border-radius: 12px; font-size: 15px; background: {{t.bg}}; color: {{t.text}}; color-scheme: {{scheme}}"></label>
      <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: {{t.muted}}">To<input type="date" value="2026-10-23" style="height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid {{t.line}}; border-radius: 12px; font-size: 15px; background: {{t.bg}}; color: {{t.text}}; color-scheme: {{scheme}}"></label>
    </div>
    <div style="padding-top: 8px; display: grid; grid-template-columns: 1fr 2fr; gap: 8px">
      <button type="button" onClick="{{reset}}" style="height: 46px; border: 0; border-radius: 14px; font-size: 15px; font-weight: 600; background: {{t.bg}}; color: {{t.text}}">Reset</button>
      <a href="Main.dc.html" style="height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; background: {{t.text}}; color: {{t.bg}}">Apply</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { period: 'All time' };
}
renderVals() {
const dark = this.props.dark ?? true;
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', line: '#E2E2DE' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', line: '#2A2D32' };
const t = dark ? D : L;
const pill = (on) => 'height: 40px; padding: 0 14px; border-radius: 999px; font-size: 14px; border: 1px solid ' + (on ? t.text : t.line) + '; font-weight: ' + (on ? 600 : 500) + '; background: ' + (on ? t.text : 'transparent') + '; color: ' + (on ? t.bg : t.text);
const starts = { 'All time': '', 'This month': '2026-10-01', 'Last 90 days': '2026-07-25', 'This year': '2026-01-01' };
const periods = Object.keys(starts).map((label) => {
const on = this.state.period === label;
return { label, on, style: pill(on), pick: () => this.setState({ period: label }) };
});
return { t, scheme: dark ? 'dark' : 'light', periods, from: starts[this.state.period], reset: () => this.setState({ period: 'All time' }) };
}
}
</script>
</body>
</html>

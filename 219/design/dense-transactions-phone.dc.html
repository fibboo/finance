<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transactions (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<img src="{{src}}" alt="Transactions (phone), captured from the app" width="390" height="844" style="display: block; width: 390px; height: 844px">
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
return { src: `./shots/transactions-phone-${dark ? 'dark' : 'light'}.png` };
}
}
</script>
</body>
</html>

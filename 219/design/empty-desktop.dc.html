<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empty state (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<img src="{{src}}" alt="Empty state (desktop), captured from the app" width="1280" height="800" style="display: block; width: 1280px; height: 800px">
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
return { src: `./shots/transactions-empty-desktop-${dark ? 'dark' : 'light'}.png` };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accounts filter sheet — variant A, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
button,input{font:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; font-family: Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{t.bg}}; color: {{t.text}}">
  <div style="padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Transactions</span>
    <span style="width: 44px; height: 44px; border-radius: 22px; background: {{t.panel}}"></span>
  </div>
  <div style="height: 40px; border-radius: 999px; background: {{t.panel}}"></div>
  <div style="flex-grow: 1; border-radius: 20px; background: {{t.panel}}"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.35)"></div>
  <div role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 720px; box-sizing: border-box; padding: 8px 16px 16px; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; gap: 8px; background: {{t.panel}}; box-shadow: 0 18px 50px rgba(0,0,0,.3)">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: {{t.line}}"></span>
    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between">
      <h2 id="sheet-title" style="margin: 0; font-size: 18px; font-weight: 600">Accounts</h2>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center; color: {{t.muted}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    </div>
    <div style="overflow-y: auto; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
          <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">{{g.label}}</legend>
          <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
            <label style="height: 44px; display: flex; align-items: center; gap: 12px; font-size: 15px; cursor: pointer">
              <input type="checkbox" checked="{{i.checked}}" onChange="{{i.toggle}}" style="width: 18px; height: 18px; margin: 0; accent-color: {{t.accent}}">
              <span aria-hidden="true" style="{{i.dotStyle}}"></span>
              <span style="flex-grow: 1">{{i.name}}</span>
              <span style="font-size: 12px; color: {{t.muted}}">{{i.note}}</span>
            </label>
          </sc-for>
        </fieldset>
      </sc-for>
    </div>
    <div style="padding-top: 8px; display: grid; grid-template-columns: 1fr 2fr; gap: 8px">
      <button type="button" onClick="{{reset}}" style="height: 46px; border: 0; border-radius: 14px; font-size: 15px; font-weight: 600; background: {{t.bg}}; color: {{t.text}}">Reset</button>
      <a href="Main.dc.html" style="height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; background: {{t.text}}; color: {{t.bg}}">Apply</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: { wallet: true, main: true } };
}
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', accent: '#1F7A55', line: '#E2E2DE' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', accent: '#4CC38A', line: '#2A2D32' };
const t = (this.props.dark ?? true) ? D : L;
const picked = this.state.picked;
const item = (id, name, note, color) => ({ id, name, note, checked: !!picked[id],
dotStyle: 'width:8px;height:8px;border-radius:4px;flex-shrink:0;background:' + color,
toggle: () => this.setState({ picked: { ...picked, [id]: !picked[id] } }) });
const groups = [
{ label: 'Money accounts', items: [item('wallet', 'Wallet', 'USD', '#4D8FBF'), item('main', 'Main card', 'EUR', '#5B6CD9'), item('savings', 'Savings', 'GEL', '#2E8C7A'), item('freelance', 'Freelance', 'USD', '#A15CB8'), item('deposit', 'Deposit', 'EUR', '#B8862C'), item('travel', 'Travel card', 'USD', '#C2613F')] }
];
return { t, groups, reset: () => this.setState({ picked: {} }) };
}
}
</script>
</body>
</html>

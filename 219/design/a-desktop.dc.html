<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transactions — variant A, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 900px; box-sizing: border-box; padding: 16px; overflow: hidden; display: flex; align-items: flex-start; gap: 16px; font-family: Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{t.bg}}; color: {{t.text}}">
  <nav aria-label="Main" style="flex: 0 0 232px; box-sizing: border-box; padding: 16px 12px; border-radius: 22px; display: flex; flex-direction: column; gap: 4px; background: {{t.panel}}">
    <div style="height: 44px; padding: 0 10px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px">
      <span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.accent}}"></span>
      finance
    </div>
    <button type="button" disabled style="height: 44px; margin-bottom: 10px; border: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; background: {{t.text}}; color: {{t.bg}}; opacity: .45; cursor: not-allowed">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add transaction
    </button>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <sc-if value="{{n.link}}" hint-placeholder-val="{{true}}">
        <a href="#" style="{{n.style}}">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"/></svg>
          {{n.label}}
        </a>
      </sc-if>
      <sc-if value="{{n.soon}}" hint-placeholder-val="{{false}}">
        <button type="button" disabled style="height: 44px; padding: 0 12px; border: 0; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; background: transparent; color: {{t.muted}}; cursor: not-allowed">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="opacity: .55"><path d="{{n.icon}}"/></svg>
          <span style="opacity: .55">{{n.label}}</span>
          <span style="margin-left: auto; padding: 2px 8px; border-radius: 8px; font-size: 11px; background: {{t.bg}}">Soon</span>
        </button>
      </sc-if>
    </sc-for>
  </nav>
  <div style="flex: 1 1 auto; min-width: 0; height: 100%; display: flex; flex-direction: column; gap: 12px">
    <div style="height: 44px; margin-top: 16px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Transactions <span style="font-weight: 400; color: {t.muted}">312</span></h1>
      <a href="#" aria-label="Account menu" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: {{t.panel}}">NI</a>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <div role="toolbar" aria-label="Filters" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
          <button type="button" aria-haspopup="dialog" style="{{c.style}}">
            {{c.label}}
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </sc-for>
      </div>
    </div>
    <div style="flex: 1 1 auto; min-height: 0; display: flex; gap: 16px">
      <section aria-label="Transactions" style="flex: 1 1 auto; min-width: 0; overflow: hidden; padding: 4px 20px; border-radius: 22px; display: flex; flex-direction: column; background: {{t.panel}}">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
          <div style="height: 40px; margin-top: 4px; padding: 0 8px 4px; display: flex; align-items: flex-end; justify-content: space-between; font-size: 13px; color: {{t.muted}}">
            <span style="font-weight: 600; color: {{t.text}}">{{d.label}}</span>
            <span>{{d.total}}</span>
          </div>
          <ul style="margin: 0; padding: 0; list-style: none">
            <sc-for list="{{d.rows}}" as="r" hint-placeholder-count="2">
              <li>
                <a href="#" aria-current="{{r.current}}" style="{{r.rowStyle}}">
                  <span aria-hidden="true" style="{{r.dotStyle}}"></span>
                  <span style="flex: 2 1 0; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span>
                  <span style="flex: 2 1 0; min-width: 0; font-size: 14px; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.accounts}}</span>
                  <span style="width: 120px; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end"><span style="{{r.amountStyle}}">{{r.amount}}</span><sc-if value="{{r.hasBase}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: {{t.muted}}">{{r.base}}</span></sc-if></span>
                </a>
              </li>
            </sc-for>
          </ul>
        </sc-for>
        <div aria-label="Loading more" style="height: 54px; padding: 0 8px; display: flex; align-items: center; gap: 14px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.bone}}"></span><span style="flex: 2 1 0"><span style="display: block; width: 150px; height: 12px; border-radius: 6px; background: {{t.bone}}"></span></span><span style="flex: 2 1 0"><span style="display: block; width: 96px; height: 12px; border-radius: 6px; background: {{t.bone}}"></span></span><span style="width: 72px; height: 12px; border-radius: 6px; background: {{t.bone}}"></span></div>
      </section>
      <aside aria-labelledby="details-title" style="flex: 0 0 360px; box-sizing: border-box; align-self: flex-start; padding: 20px; border-radius: 22px; display: flex; flex-direction: column; gap: 16px; background: {{t.panel}}">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 13px; color: {{t.muted}}">Expense · Wed, Oct 15, 2026</span>
            <h2 id="details-title" style="margin: 0; font-size: 20px; font-weight: 600">Rent</h2>
          </div>
          <button type="button" aria-label="Close details" style="width: 44px; height: 44px; margin: -8px -10px 0 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: {{t.muted}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 36px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1">−€850.00</span>
          <span style="font-size: 14px; color: {{t.muted}}">≈ $927.90</span>
        </div>
        <section aria-labelledby="postings-title" style="padding: 4px 14px; border-radius: 14px; display: flex; flex-direction: column; background: {{t.bg}}">
          <h3 id="postings-title" style="margin: 0; padding: 10px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: {{t.muted}}">Postings</h3>
          <sc-for list="{{postings}}" as="p" hint-placeholder-count="2">
            <div style="min-height: 52px; display: flex; align-items: center; gap: 12px">
              <span aria-hidden="true" style="{{p.dotStyle}}"></span>
              <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px">{{p.account}}</span><span style="font-size: 12px; color: {{t.muted}}">{{p.kind}}</span></span>
              <span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 15px; font-weight: 500">{{p.amount}}</span><span style="font-size: 12px; color: {{t.muted}}">{{p.base}}</span></span>
            </div>
          </sc-for>
        </section>
        <dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 16px; row-gap: 10px; font-size: 14px">
          <dt style="color: {{t.muted}}">Location</dt><dd style="margin: 0; text-align: right">Tbilisi, Georgia</dd>
          <dt style="color: {{t.muted}}">Comment</dt><dd style="margin: 0; text-align: right">October, flat on Paliashvili</dd>
        </dl>
        <button type="button" style="height: 46px; border: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; background: {{t.bg}}; color: {{t.danger}}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
          Delete transaction
        </button>
      </aside>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', accent: '#1F7A55', line: '#E2E2DE', bone: '#E4E4E0', selected: '#EAF3EE', danger: '#B42318' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', accent: '#4CC38A', line: '#2A2D32', bone: '#24272B', selected: '#16241D', danger: '#FF7A6B' };
const t = (this.props.dark ?? true) ? D : L;
const chipBase = 'height: 40px; padding: 0 12px 0 14px; border: 0; border-radius: 999px; display: flex; align-items: center; gap: 4px; font-size: 14px; white-space: nowrap; ';
const chips = [
{ label: 'Period', on: false },
{ label: 'Type', on: false },
{ label: 'Accounts', on: false },
{ label: 'Categories', on: false },
{ label: 'Income', on: false },
{ label: 'Amount', on: false },
{ label: 'Newest first', on: false }
].map((c) => ({ ...c, style: chipBase + (c.on ? 'font-weight: 600; background: ' + t.text + '; color: ' + t.bg : 'font-weight: 500; background: ' + t.panel + '; color: ' + t.text) }));
const row = (title, accounts, amount, color, income, current, base) => ({ title, accounts, amount, current: current ? 'true' : 'false', base: base || '', hasBase: !!base,
rowStyle: 'height: 54px; padding: 0 8px; border-radius: 12px; display: flex; align-items: center; gap: 14px; background: ' + (current ? t.selected : 'transparent'),
dotStyle: 'width:8px;height:8px;border-radius:4px;flex-shrink:0;background:' + color,
amountStyle: 'font-size:15px;font-weight:500;color:' + (income ? t.accent : t.text) });
const days = [
{ label: 'Today', total: '−$47.30', rows: [row('Groceries', 'Wallet', '−$42.80', '#4D8FBF'), row('Cafes', 'Wallet', '−$4.50', '#4D8FBF')] },
{ label: 'Yesterday', total: '+$2,291.30', rows: [row('Salary', 'Main card', '+€2,100.00', '#5B6CD9', true, false, '≈ +$2,291.30'), row('Transfer to Savings', 'Main card → Savings', '€300.00', '#2E8C7A', false, false, '≈ $327.40')] },
{ label: 'Wed, Oct 15', total: '−$915.90', rows: [row('Rent', 'Main card', '−€850.00', '#5B6CD9', false, true, '≈ −$927.90'), row('Balance adjustment', 'Wallet', '+$12.00', '#4D8FBF')] },
{ label: 'Tue, Oct 14', total: '−$61.20', rows: [row('Groceries', 'Wallet', '−$61.20', '#4D8FBF')] }
];
const dot = (c) => 'width:8px;height:8px;border-radius:4px;flex-shrink:0;background:' + c;
const postings = [
{ account: 'Main card', kind: 'Money · EUR', amount: '−€850.00', base: '≈ −$927.90', dotStyle: dot('#5B6CD9') },
{ account: 'Rent', kind: 'Category', amount: '+€850.00', base: '≈ +$927.90', dotStyle: dot('#C24E6E') }
];
const navBase = 'height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 15px; ';
const nav = [
{ label: 'Home', icon: 'M4 11 12 4l8 7v9h-5v-6H9v6H4z', link: true },
{ label: 'Transactions', icon: 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01', link: true, active: true },
{ label: 'Accounts', icon: 'M6 6h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3zM3 10h18M16 14.5h2' },
{ label: 'Categories', icon: 'M3 12V4h8l10 10-8 8zM7.5 8.5h.01' }
].map((n) => ({ ...n, link: !!n.link, soon: !n.link, style: navBase + (n.active ? 'font-weight: 600; background: ' + t.bg : 'font-weight: 500; color: ' + t.muted) }));
return { t, chips, days, postings, nav };
}
}
</script>
</body>
</html>

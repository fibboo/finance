<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance · Выбор счёта и категории</title>
<style>
:root { color-scheme: dark; font: 15px system-ui, sans-serif; background: #0b0c0e; color: #ecedee }
body { margin: 0; display: flex; flex-direction: column; height: 100dvh }
nav { display: flex; gap: .5rem 1rem; flex-wrap: wrap; padding: .6rem 1rem; background: #17191c; border-bottom: 1px solid #2a2d32 }
label { display: flex; align-items: center; gap: .4rem }
select { font: inherit; color: inherit; max-width: 100%; min-height: 2.75rem; padding: .4rem .6rem; border: 1px solid #42464c; border-radius: .5rem; background: #24272b }
iframe { display: block; flex: 1; min-height: 0; border: 0; width: 100%; margin: 0 auto }
.phone { max-width: 390px }
</style>
</head>
<body>
<nav aria-label="Настройки макета">
  <label>Поле <select id="screen"><option value="account">Счёт</option><option value="category">Категория</option></select></label>
  <label>Операция <select id="mode"><option value="new">Новая</option><option value="edit">Редактирование</option></select></label>
  <label>Вариант <select id="variant"><option value="1">1 · Тип справа</option><option value="2">2 · Тип под названием</option><option value="0">0 · Как сейчас</option></select></label>
  <label>Ширина <select id="size"><option value="desktop">Окно</option><option value="phone">Телефон</option></select></label>
  <label>Тема <select id="theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label>
  <label>Типы <select id="types"><option value="multiple">Несколько</option><option value="single">Один</option></select></label>
</nav>
<iframe title="Макет выбора сущности в Finance"></iframe>
<script>
const controls = [...document.querySelectorAll('select')];
const frame = document.querySelector('iframe');
const params = new URLSearchParams(location.search);
for (const control of controls) {
  const value = params.get(control.id);
  if ([...control.options].some(option => option.value === value)) control.value = value;
  control.addEventListener('change', show);
}
function show() {
  const values = Object.fromEntries(controls.map(control => [control.id, control.value]));
  const query = new URLSearchParams(values);
  history.replaceState(null, '', '?' + query);
  frame.classList.toggle('phone', values.size === 'phone');
  frame.src = 'stage.html?' + query;
}
show();
</script>
</body>
</html>

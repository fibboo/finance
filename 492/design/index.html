<!doctype html><meta charset="utf-8"><title>Different currency — варианты</title><style>body{font:16px system-ui;background:#292c30;color:#eee;margin:24px}label{margin-right:14px}select{padding:8px;font:inherit}iframe{display:block;margin-top:20px;border:0;width:1280px;height:844px}a{color:#8bceff}</style><h1>Different currency</h1><p>Компактный вариант: In USD, Different currency и сумма в одном блоке. Original amount — для расходов и доходов.</p><label>Экран <select id="screen"><option value="income-on" selected>income-on</option><option value="income-no-base-on">income-no-base-on</option><option value="income-no-base-off">income-no-base-off</option><option value="expense-off">expense-off</option><option value="expense-on">expense-on</option><option value="edit-expense-off">edit-expense-off</option><option value="edit-expense-on">edit-expense-on</option><option value="income-off">income-off</option><option value="income-on">income-on</option><option value="edit-income-off">edit-income-off</option><option value="edit-income-on">edit-income-on</option></select></label><label>Ширина <select id="width"><option>phone</option><option>desktop</option></select></label><label>Тема <select id="theme"><option>dark</option><option>light</option></select></label><iframe title="Макет"></iframe><script>function update(){const p=new URLSearchParams();for(const id of ['screen','width','theme'])p.set(id,document.getElementById(id).value);document.querySelector('iframe').src='screens.html?'+p;document.querySelector('iframe').style.width=document.getElementById('width').value==='phone'?'390px':'1280px'}document.querySelectorAll('select').forEach(s=>s.onchange=update);update()</script>

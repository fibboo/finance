<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account action icons</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light dark;
  --ground: light-dark(#eeeeeb, #0b0c0e);
  --panel: light-dark(#ffffff, #17191c);
  --ink: light-dark(#17181a, #ecedee);
  --muted: light-dark(#5a5d64, #9a9ea6);
  --accent: light-dark(#1f7a55, #4cc38a);
  --danger: light-dark(#b42318, #ff7a6b);
}
:root[data-theme='dark'] { color-scheme: dark; }
:root[data-theme='light'] { color-scheme: light; }
body { margin: 0; padding: 24px; background: #888; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px; align-items: flex-start; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.board { box-sizing: border-box; background: var(--ground); color: var(--ink); }
.phone { width: 390px; height: 844px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.desktop { width: 1280px; height: 720px; display: grid; grid-template-columns: 240px 1fr 440px; gap: 16px; padding: 16px; }
.panel { background: var(--panel); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; align-items: center; gap: 12px; }
.mark { width: 48px; height: 48px; border-radius: 14px; background: var(--accent); color: var(--panel); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 20px; }
.meta { font-size: 13px; color: var(--muted); }
.title { font-size: 20px; font-weight: 600; }
.balance { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
.actions { display: flex; gap: 8px; }
.action { flex: 1 1 0; height: 52px; border-radius: 14px; background: var(--ground); display: flex; align-items: center; justify-content: center; }
.danger { color: var(--danger); }
.close { width: 44px; height: 44px; margin-left: auto; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.page-title { font-size: 24px; font-weight: 600; padding: 4px 4px 0; }
.row { background: var(--panel); border-radius: 16px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 12px; }
.row .name { flex: 1 1 auto; font-size: 15px; }
.row .letter { width: 32px; height: 32px; border-radius: 10px; background: var(--ground); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
.row .tool { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
.row .tool svg { width: 18px; height: 18px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.tabbar { margin-top: auto; background: var(--panel); border-radius: 20px; padding: 6px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; font-size: 11px; color: var(--muted); }
.current { color: var(--ink); font-weight: 600; }
.side { background: var(--panel); border-radius: 24px; padding: 76px 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.side .tab { flex-direction: row; gap: 12px; padding: 0 12px; height: 44px; font-size: 15px; border-radius: 12px; }
.side .current { background: var(--ground); }
.add { height: 44px; margin-bottom: 10px; border-radius: 12px; background: var(--accent); color: var(--panel); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 15px; }
.add svg { width: 16px; height: 16px; }
.main { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true">
  <symbol id="adjust" viewBox="0 0 24 24"><path d="M12 4v10M7 9h10M7 19h10"/></symbol>
  <symbol id="transactions" viewBox="0 0 24 24"><path d="M3.5 6h4M5.5 4v4M3.5 12h4M3.5 18h4M11 6h9M11 12h9M11 18h9"/></symbol>
  <symbol id="edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="delete" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></symbol>
  <symbol id="accounts" viewBox="0 0 24 24"><path d="M6 6h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3M3 10h18M16 14.5h2"/></symbol>
  <symbol id="categories" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8zM7.5 7.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6"/></symbol>
  <symbol id="more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<div class="board phone">
  <div class="panel">
    <div class="head">
      <span class="mark">M</span>
      <span><div class="meta">Card · USD</div><div class="title">Main card</div></span>
      <span class="close"><svg><use href="#close"/></svg></span>
    </div>
    <div class="balance">1,240.50 USD</div>
    <div class="actions">
      <span class="action" title="Adjust balance"><svg><use href="#adjust"/></svg></span>
      <span class="action" title="Transactions"><svg><use href="#transactions"/></svg></span>
      <span class="action" title="Edit"><svg><use href="#edit"/></svg></span>
      <span class="action danger" title="Delete"><svg><use href="#delete"/></svg></span>
    </div>
  </div>
  <div class="page-title">Categories</div>
  <div class="list">
    <div class="row"><span class="letter">G</span><span class="name">Groceries</span><span class="tool"><svg><use href="#transactions"/></svg></span><span class="tool"><svg><use href="#edit"/></svg></span><span class="tool"><svg><use href="#delete"/></svg></span></div>
    <div class="row"><span class="letter">T</span><span class="name">Transport</span><span class="tool"><svg><use href="#transactions"/></svg></span><span class="tool"><svg><use href="#edit"/></svg></span><span class="tool"><svg><use href="#delete"/></svg></span></div>
  </div>
  <nav class="tabbar">
    <span class="tab"><svg><use href="#home"/></svg>Home</span>
    <span class="tab"><svg><use href="#transactions"/></svg>Transactions</span>
    <span class="tab current"><svg><use href="#accounts"/></svg>Accounts</span>
    <span class="tab"><svg><use href="#categories"/></svg>Categories</span>
    <span class="tab"><svg><use href="#more"/></svg>More</span>
  </nav>
</div>

<div class="board desktop">
  <nav class="side">
    <span class="add"><svg><use href="#plus"/></svg>Add transaction</span>
    <span class="tab"><svg><use href="#home"/></svg>Home</span>
    <span class="tab"><svg><use href="#transactions"/></svg>Transactions</span>
    <span class="tab current"><svg><use href="#accounts"/></svg>Accounts</span>
    <span class="tab"><svg><use href="#categories"/></svg>Categories</span>
    <span class="tab"><svg><use href="#more"/></svg>More</span>
  </nav>
  <div class="main">
    <div class="page-title">Accounts</div>
    <div class="list">
      <div class="row"><span class="letter">M</span><span class="name">Main card</span><span class="meta">1,240.50 USD</span></div>
      <div class="row"><span class="letter">C</span><span class="name">Cash</span><span class="meta">310.00 EUR</span></div>
      <div class="page-title" style="padding-top: 16px">Categories</div>
      <div class="row"><span class="letter">G</span><span class="name">Groceries</span><span class="tool"><svg><use href="#transactions"/></svg></span><span class="tool"><svg><use href="#edit"/></svg></span><span class="tool"><svg><use href="#delete"/></svg></span></div>
      <div class="row"><span class="letter">T</span><span class="name">Transport</span><span class="tool"><svg><use href="#transactions"/></svg></span><span class="tool"><svg><use href="#edit"/></svg></span><span class="tool"><svg><use href="#delete"/></svg></span></div>
    </div>
  </div>
  <div class="panel" style="align-self: start">
    <div class="head">
      <span class="mark">M</span>
      <span><div class="meta">Card · USD</div><div class="title">Main card</div></span>
      <span class="close"><svg><use href="#close"/></svg></span>
    </div>
    <div class="balance">1,240.50 USD</div>
    <div class="actions">
      <span class="action" title="Adjust balance"><svg><use href="#adjust"/></svg></span>
      <span class="action" title="Transactions"><svg><use href="#transactions"/></svg></span>
      <span class="action" title="Edit"><svg><use href="#edit"/></svg></span>
      <span class="action danger" title="Delete"><svg><use href="#delete"/></svg></span>
    </div>
  </div>
</div>
</body>
</html>

name: deploy

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  freshness:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is_latest: ${{ steps.compare.outputs.is_latest }}
    steps:
      - name: Compare with the head of main
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          elif [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$HEAD_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$HEAD_SHA is no longer the head of main, so it is not deployed."
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: freshness
    if: needs.freshness.outputs.is_latest == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Render env files
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          for name in JWT_SECRET POSTGRES_PASSWORD CLOUDFLARE_TUNNEL_TOKEN TELEGRAM_CLIENT_ID TELEGRAM_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            case "${!name}" in
              "") echo "::error::The secret $name is not set."; exit 1 ;;
              *"'"*) echo "::error::The secret $name contains a single quote."; exit 1 ;;
            esac
          done
          umask 077
          mkdir -p deploy/backend
          envsubst '${JWT_SECRET} ${POSTGRES_PASSWORD} ${TELEGRAM_CLIENT_ID} ${TELEGRAM_CLIENT_SECRET} ${GOOGLE_CLIENT_ID} ${GOOGLE_CLIENT_SECRET}' \
            < backend/.env-production > deploy/backend/.env-production
          {
            echo "COMPOSE_FILE=docker-compose.production.yml"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "POSTGRES_PASSWORD='$POSTGRES_PASSWORD'"
            echo "CLOUDFLARE_TUNNEL_TOKEN='$CLOUDFLARE_TUNNEL_TOKEN'"
          } > deploy/.env
          cp docker-compose.production.yml deploy/

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/fibboo/finance-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/fibboo/finance-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_TARGET" 'umask 077 && mkdir -p ~/finance/backend'
          scp -p -i ~/.ssh/deploy_key deploy/.env deploy/docker-compose.production.yml "$SSH_TARGET:finance/"
          scp -p -i ~/.ssh/deploy_key deploy/backend/.env-production "$SSH_TARGET:finance/backend/"
          ssh -i ~/.ssh/deploy_key "$SSH_TARGET" IMAGE_TAG="$IMAGE_TAG" bash -s <<'EOF'
          set -eu
          cd ~/finance
          docker compose pull
          docker compose up -d --wait postgres
          umask 077
          mkdir -p ~/backups
          docker compose exec -T postgres pg_dump -U finance -d finance -Fc < /dev/null > ~/backups/pre-deploy.dump.tmp
          mv ~/backups/pre-deploy.dump.tmp ~/backups/pre-deploy-$IMAGE_TAG.dump
          ls -1t ~/backups/pre-deploy-*.dump | tail -n +6 | xargs -r rm --
          docker compose run --rm -T backend alembic upgrade head < /dev/null
          docker compose up -d --remove-orphans
          docker images --filter 'reference=ghcr.io/fibboo/finance-*' --format '{{.Repository}}:{{.Tag}}' | grep -v ":$IMAGE_TAG\$" | xargs -r docker rmi
          EOF

name: deploy

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  freshness:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      is_latest: ${{ steps.compare.outputs.is_latest }}
    steps:
      - name: Compare with the head of main
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          elif [ "$(curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.sha" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main")" = "$HEAD_SHA" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$HEAD_SHA is no longer the head of main, so it is not deployed."
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: freshness
    if: needs.freshness.outputs.is_latest == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Render env files
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          TELEGRAM_CLIENT_ID: ${{ secrets.TELEGRAM_CLIENT_ID }}
          TELEGRAM_CLIENT_SECRET: ${{ secrets.TELEGRAM_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          for name in JWT_SECRET POSTGRES_PASSWORD CLOUDFLARE_TUNNEL_TOKEN TELEGRAM_CLIENT_ID TELEGRAM_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            case "${!name}" in
              "") echo "::error::The secret $name is not set."; exit 1 ;;
              *"'"*) echo "::error::The secret $name contains a single quote."; exit 1 ;;
            esac
          done
          umask 077
          mkdir -p deploy/backend
          envsubst '${JWT_SECRET} ${POSTGRES_PASSWORD} ${TELEGRAM_CLIENT_ID} ${TELEGRAM_CLIENT_SECRET} ${GOOGLE_CLIENT_ID} ${GOOGLE_CLIENT_SECRET}' \
            < backend/.env-production > deploy/backend/.env-production
          {
            echo "COMPOSE_FILE=docker-compose.production.yml"
            echo "IMAGE_TAG=$IMAGE_TAG"
            echo "POSTGRES_PASSWORD='$POSTGRES_PASSWORD'"
            echo "CLOUDFLARE_TUNNEL_TOKEN='$CLOUDFLARE_TUNNEL_TOKEN'"
          } > deploy/.env
          cp docker-compose.production.yml deploy/

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
          echo "$GITHUB_TOKEN" | DOCKER_CONFIG="$RUNNER_TEMP/docker" docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push backend image
        run: |
          docker build -t "ghcr.io/fibboo/finance-backend:$IMAGE_TAG" -f backend/Dockerfile backend
          docker push "ghcr.io/fibboo/finance-backend:$IMAGE_TAG"

      - name: Build and push frontend image
        run: |
          docker build -t "ghcr.io/fibboo/finance-frontend:$IMAGE_TAG" -f frontend/Dockerfile frontend
          docker push "ghcr.io/fibboo/finance-frontend:$IMAGE_TAG"

      - name: Deploy
        run: |
          umask 077
          mkdir -p ~/finance/backend ~/backups
          cp deploy/.env deploy/docker-compose.production.yml ~/finance/
          cp deploy/backend/.env-production ~/finance/backend/
          cd ~/finance
          docker compose pull
          docker compose up -d --wait --no-recreate postgres
          docker compose exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' < /dev/null > ~/backups/pre-deploy.dump.tmp
          mv ~/backups/pre-deploy.dump.tmp ~/backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ)-$IMAGE_TAG.dump
          ls -1t ~/backups/pre-deploy-*.dump | tail -n +6 | xargs -r rm --
          docker compose run --rm --no-deps -T backend alembic upgrade head < /dev/null
          docker compose up -d --remove-orphans --wait --wait-timeout 300
          docker images --filter 'reference=ghcr.io/fibboo/finance-*' --format '{{.Repository}}:{{.Tag}}' | grep -v ":$IMAGE_TAG\$" | xargs -r docker rmi

      - name: Remove rendered env files, prune dangling images and old build cache
        if: always()
        run: |
          rm -rf deploy
          docker image prune -f
          docker builder prune -f --filter until=168h

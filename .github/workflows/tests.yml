name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      api_schema: ${{ steps.filter.outputs.api_schema }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            api_schema:
              - 'backend/**'
              - 'frontend/src/lib/api-schema.ts'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
            workflows:
              - '.github/workflows/**'

  tests:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build test image
        run: docker build -t finance-test -f backend/tests/Dockerfile backend

      - name: Run tests
        run: docker run --rm finance-test pytest -v -n auto

  frontend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npx prettier --check .

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  api-schema:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.api_schema == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend image
        run: docker build -t finance-test -f backend/tests/Dockerfile backend

      - name: Start backend
        run: |
          docker run -d --env-file backend/.env -p 8000:8000 finance-test uvicorn app.main:app --host 0.0.0.0
          curl -sf --retry 30 --retry-all-errors --retry-delay 1 -o /dev/null http://localhost:8000/openapi.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Regenerate API types
        working-directory: frontend
        run: npm run generate:api

      - name: Fail on stale API types
        run: git diff --exit-code frontend/src/lib/api-schema.ts

name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t finance-test -f backend/tests/Dockerfile backend

      - name: Run tests
        run: docker run --rm finance-test pytest -v -n auto

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home — first run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 104px; position: relative; display: flex; flex-direction: column; gap: 12px; font-family: Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{t.bg}}; color: {{t.text}}">
  <div style="padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px">
      <span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.accent}}"></span>
      finance
    </div>
    <a href="synth-menu-popover.dc.html" aria-label="Account menu" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: {{t.panel}}">NI</a>
  </div>
  <section aria-label="Balance" style="height: 164px; box-sizing: border-box; padding: 16px; border-radius: 20px; display: flex; flex-direction: column; gap: 12px; background: {{t.panel}}">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: {{t.muted}}">Total balance · USD</span>
      <span style="font-size: 36px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1">$0.00</span>
    </div>
    <div style="display: flex; flex-direction: column">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div style="padding: 8px 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 2px; background: {{t.bg}}"><span style="font-size: 12px; color: {{t.muted}}">Earned · Oct</span><span style="font-size: 15px; font-weight: 600; ">$0</span></div>
        <div style="padding: 8px 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 2px; background: {{t.bg}}"><span style="font-size: 12px; color: {{t.muted}}">Spent · Oct</span><span style="font-size: 15px; font-weight: 600">$0</span></div>
        <div style="padding: 8px 12px; border-radius: 12px; display: flex; flex-direction: column; gap: 2px; background: {{t.bg}}"><span style="font-size: 12px; color: {{t.muted}}">Left · Oct</span><span style="font-size: 15px; font-weight: 600">$0</span></div>
      </div>
    </div>
  </section>
  <section aria-label="Accounts" style="box-sizing: border-box; padding: 4px 16px 8px; border-radius: 20px; display: flex; flex-direction: column; background: {{t.panel}}">
    <div style="height: 42px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 15px; font-weight: 600">Accounts</span></div>
    <div style="display: grid; grid-template-rows: repeat(auto-fill, 48px); grid-auto-rows: 0; overflow: hidden">
    <sc-for list="{{accounts}}" as="a" hint-placeholder-count="9">
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; overflow: hidden">
        <span aria-hidden="true" style="{{a.chipStyle}}">{{a.initial}}</span>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 500">{{a.name}}</span><span style="font-size: 12px; color: {{t.muted}}">{{a.currency}}</span></div>
        <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 15px; font-weight: 500">{{a.balance}}</span><span style="font-size: 12px; color: {{t.muted}}">{{a.base}}</span></div>
      </div>
    </sc-for>
    </div>
  </section>
  <section aria-label="Recent transactions" style="padding: 8px 18px 8px; border-radius: 20px; display: flex; flex-direction: column; background: {{t.panel}}">
    <div style="height: 40px; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 15px; font-weight: 600">Recent</span></div>
    <div style="height: 132px; margin: 0 0 10px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; background: {{t.bg}}">
      <span style="font-size: 15px; font-weight: 600">Nothing here yet</span>
      <span style="font-size: 13px; color: {{t.muted}}">Your income and expenses will show up here.</span>
    </div>
  </section>
  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 16px; height: 68px; padding: 0 6px; border-radius: 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: {{t.panel}}; border: 1px solid {{t.line}}; box-shadow: 0 10px 30px rgba(0,0,0,.28)">
    <a href="#" aria-current="page" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: {{t.text}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>
      Home
    </a>
    <button type="button" disabled title="Soon" style="height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: {{t.muted}}; opacity: .5; cursor: not-allowed">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      Transactions
    </button>
    <button type="button" disabled aria-label="Add transaction (soon)" title="Soon" style="justify-self: center; width: 52px; height: 52px; border: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: {{t.text}}; color: {{t.bg}}; opacity: .45; cursor: not-allowed">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" disabled title="Soon" style="height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: {{t.muted}}; opacity: .5; cursor: not-allowed">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>
      Accounts
    </button>
    <button type="button" disabled title="Soon" style="height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: {{t.muted}}; opacity: .5; cursor: not-allowed">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg>
      Categories
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', line: '#E2E2DE', accent: '#1F7A55' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', line: '#2A2D32', accent: '#4CC38A' };
const dark = this.props.dark ?? true;
const t = dark ? D : L;
const chip = (c) => 'width:34px;height:34px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:' + c + (dark ? '33' : '22') + ';color:' + c;
const accounts = [
{ name: 'Wallet', currency: 'USD', balance: '$0.00', base: '', color: '#4D8FBF' }
].map((a) => ({ ...a, initial: a.name[0], chipStyle: chip(a.color) }));
const recent = [
{ title: 'Groceries', meta: 'Today · Wallet', amount: '−$42.80', income: false, color: '#4D8FBF' },
{ title: 'Salary', meta: 'Yesterday · Main card', amount: '+€2,100.00', income: true, color: '#5B6CD9' },
{ title: 'Transfer to Savings', meta: 'Oct 16 · Main card → Savings', amount: '€300.00', income: false, color: '#2E8C7A' }
].map((r) => ({ ...r,
dotStyle: 'width:8px;height:8px;border-radius:4px;flex-shrink:0;background:' + r.color,
amountStyle: 'font-size:15px;font-weight:500;color:' + (r.income ? t.accent : t.text) }));
return { t, accounts, recent };
}
}
</script>
</body>
</html>

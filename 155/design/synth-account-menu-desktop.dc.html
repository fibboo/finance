<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synthesis — Account menu desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 640px; box-sizing: border-box; padding: 16px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; font-family: Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{t.bg}}; color: {{t.text}}">
  <div aria-hidden="true" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; height: 608px; padding: 16px 12px; border-radius: 22px; display: flex; flex-direction: column; gap: 10px; background: {{t.panel}}">
    <div style="height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.accent}}"></span>finance</div>
    <div style="height: 44px; border-radius: 12px; background: {{t.text}}; opacity: .2"></div>
    <div style="height: 44px; border-radius: 12px; background: {{t.bg}}"></div>
  </div>
  <div style="flex: 999 1 560px; min-width: 0; max-width: 1180px; display: flex; flex-direction: column; gap: 16px; position: relative">
    <div style="height: 76px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Home</h1>
      <div style="display: flex; align-items: center; gap: 12px">
        <a href="synth-home-desktop.dc.html" aria-label="Close account menu" aria-expanded="true" style="width: 44px; height: 44px; border-radius: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; background: {{t.panel}}; border: 2px solid {{t.text}}">NI</a>
      </div>
    </div>
    <div aria-hidden="true" style="height: 170px; border-radius: 22px; background: {{t.panel}}; opacity: .6"></div>
    <div aria-hidden="true" style="height: 200px; border-radius: 22px; background: {{t.panel}}; opacity: .6"></div>
    <div role="dialog" aria-label="Account" style="position: absolute; top: 72px; right: 0; width: 340px; max-width: calc(100% - 48px); box-sizing: border-box; padding: 20px; border-radius: 20px; display: flex; flex-direction: column; gap: 20px; background: {{t.panel}}; border: 1px solid {{t.line}}; box-shadow: 0 18px 50px rgba(0,0,0,.25)">
      <div style="display: flex; align-items: center; gap: 14px">
        <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; background: {{t.bg}}">NI</span>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600">nikita</span><span style="font-size: 13px; color: {{t.muted}}">Signed in with Telegram</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span id="theme-label-desktop" style="font-size: 13px; color: {{t.muted}}">Theme</span>
        <div role="radiogroup" aria-labelledby="theme-label-desktop" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: {{t.bg}}">
          <sc-for list="{{themes}}" as="o" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="{{o.style}}">
              <sc-if value="{{o.isSystem}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></sc-if>
              <sc-if value="{{o.isLight}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></sc-if>
              <sc-if value="{{o.isDark}}" hint-placeholder-val="{{false}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></sc-if>
              {{o.label}}
            </button>
          </sc-for>
        </div>
        <span style="font-size: 13px; color: {{t.muted}}">{{hint}}</span>
      </div>
      <button type="button" style="height: 46px; border-radius: 12px; font-size: 15px; font-weight: 600; background: transparent; color: {{t.text}}; border: 1px solid {{t.line}}">Sign out</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":640}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { theme: 'system' }; }
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', line: '#DADAD5', accent: '#1F7A55' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', line: '#30343A', accent: '#4CC38A' };
const theme = this.state.theme;
const dark = theme === 'system' ? (this.props.dark ?? false) : theme === 'dark';
const t = dark ? D : L;
const themes = [['system','System'],['light','Light'],['dark','Dark']].map(([id, label]) => {
const on = id === theme;
return { label, checked: on ? 'true' : 'false', isSystem: id === 'system', isLight: id === 'light', isDark: id === 'dark',
style: 'height:40px;border:0;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;background:' + (on ? t.panel : 'transparent') + ';color:' + (on ? t.text : t.muted) + (on ? ';box-shadow:0 1px 3px rgba(0,0,0,.18)' : ''),
pick: () => this.setState({ theme: id }) };
});
const hint = theme === 'system' ? 'Follows your device setting.' : 'Kept on this device.';
return { t, themes, hint };
}
}
</script>
</body>
</html>

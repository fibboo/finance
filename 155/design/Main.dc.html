<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.8}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 24px 32px; display: flex; flex-direction: column; font-family: Geist, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px; letter-spacing: -0.01em">
    <span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.accent}}"></span>
    finance
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px">
    <h1 style="margin: 0; font-size: 40px; line-height: 1.08; font-weight: 600; letter-spacing: -0.03em">Every coin<br>on the record.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: {{t.muted}}">Accounts, spending and income across currencies, in one quiet place.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 52px; border: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; background: {{t.text}}; color: {{t.bg}}">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 4 3 11l6 2.5L11 20l3.5-4.5L19 19z"/><path d="m9 13.5 7-5"/></svg>
      Continue with Telegram
    </button>
    <button type="button" style="height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 600; background: {{t.surface}}; color: {{t.text}}; border: 1px solid {{t.line}}">
      <span aria-hidden="true" style="font-weight: 700">G</span>
      Continue with Google
    </button>
    <p style="margin: 8px 0 0; text-align: center; font-size: 13px; color: {{t.muted}}">First sign-in creates your account.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', surface: '#FFFFFF', text: '#17181A', muted: '#5E6168', line: '#E2E2DE', accent: '#1F7A55' };
const D = { bg: '#0B0C0E', surface: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', line: '#2A2D32', accent: '#4CC38A' };
return { t: (this.props.dark ?? true) ? D : L };
}
}
</script>
</body>
</html>

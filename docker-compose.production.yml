services:

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env-production

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create a category, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 24px; position: relative; overflow: hidden; display: flex; gap: 24px; font-family: Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{t.bg}}; color: {{t.text}}">
  <div style="width: 220px; flex-shrink: 0; border-radius: 20px; background: {{t.panel}}"></div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px">
    <span style="padding: 6px 8px 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Home</span>
    <div style="height: 200px; border-radius: 20px; background: {{t.panel}}"></div>
    <div style="flex-grow: 1; display: grid; grid-template-columns: 1fr 2fr; gap: 16px">
      <div style="border-radius: 20px; background: {{t.panel}}"></div>
      <div style="border-radius: 20px; background: {{t.panel}}"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.35)"></div>
  <form role="dialog" aria-modal="true" aria-labelledby="create-title" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 440px; height: 680px; margin: 0; box-sizing: border-box; padding: 20px 24px 24px; border-radius: 20px; display: flex; flex-direction: column; gap: 16px; background: {{t.panel}}; box-shadow: 0 18px 50px rgba(0,0,0,.3)">
    <div style="height: 32px; display: flex; align-items: center; gap: 4px">
      <a href="picker-desktop.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: {{t.muted}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></a>
      <h2 id="create-title" style="margin: 0; font-size: 18px; font-weight: 600">New category</h2>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 500; color: {{t.muted}}">Name</span>
      <input value="Coffee shops" style="height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid {{t.line}}; background: {{t.bg}}; font-size: 15px">
    </label>
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
      <legend style="padding: 0 0 6px; font-size: 13px; font-weight: 500; color: {{t.muted}}">Type</legend>
      <div style="padding: 3px; border-radius: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; background: {{t.bg}}">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{k.checked}}" onClick="{{k.pick}}" style="{{k.style}}">{{k.label}}</button>
        </sc-for>
      </div>
      <span style="font-size: 13px; line-height: 1.4; color: {{t.muted}}">{{kindHint}}</span>
    </fieldset>
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0 0 8px; font-size: 13px; font-weight: 500; color: {{t.muted}}">Color</legend>
      <div role="radiogroup" aria-label="Color" style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); row-gap: 6px; justify-items: center">
        <sc-for list="{{colors}}" as="c" hint-placeholder-count="18">
          <button type="button" role="radio" aria-checked="{{c.checked}}" aria-label="{{c.name}}" disabled="{{c.disabled}}" onClick="{{c.pick}}" style="{{c.style}}"><span aria-hidden="true" style="{{c.swatch}}"></span></button>
        </sc-for>
      </div>
      <span style="font-size: 13px; line-height: 1.4; color: {{colorNoteColor}}">{{colorNote}}</span>
    </fieldset>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 500; color: {{t.muted}}">Description <span style="font-weight: 400">(optional)</span></span>
      <textarea rows="3" placeholder="e.g. Cafés and coffee to go" style="box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid {{t.line}}; background: {{t.bg}}; font-size: 15px; resize: none"></textarea>
    </label>
    <div style="flex-grow: 1"></div>
    <button type="submit" disabled="{{allTaken}}" style="{{submitStyle}}">Create category</button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"allTaken":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { kind: 'VARIABLE', color: null };
}
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', accent: '#1F7A55', line: '#E2E2DE' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', accent: '#4CC38A', line: '#2A2D32' };
const t = (this.props.dark ?? true) ? D : L;
const kinds = [['VARIABLE', 'Variable'], ['FIXED', 'Fixed'], ['PERIODIC', 'Periodic']].map(([key, label]) => {
const on = this.state.kind === key;
return { label, checked: on ? 'true' : 'false', pick: () => this.setState({ kind: key }),
style: 'height: 38px; border: 0; border-radius: 9px; font-size: 14px; font-weight: 600; background: ' + (on ? t.panel : 'transparent') + '; color: ' + (on ? t.text : t.muted) + (on ? '; box-shadow: 0 1px 3px rgba(0,0,0,.18)' : '') };
});
const palette = [['Blue', '#4D8FBF'], ['Teal', '#2E8C7A'], ['Indigo', '#5B6CD9'], ['Purple', '#A15CB8'], ['Amber', '#B8862C'], ['Rust', '#C2613F'], ['Rose', '#C24E6E'], ['Olive', '#6E8A3A'], ['Violet', '#8A6FD1'], ['Cyan', '#2F9BB3'], ['Green', '#3E9A5C'], ['Steel', '#4F6D8F'], ['Pink', '#D07FA8'], ['Brown', '#9C7A5B'], ['Mustard', '#C9A227'], ['Orange', '#D9743A'], ['Magenta', '#B05C9E'], ['Slate', '#7A8A99']];
const allTaken = this.props.allTaken ?? false;
const used = allTaken ? palette.map((_, i) => i) : [0, 1, 3, 4, 5, 6, 7, 8];
const firstFree = palette.findIndex((_, i) => !used.includes(i));
const picked = this.state.color ?? firstFree;
const colors = palette.map(([name, hex], i) => {
const isUsed = used.includes(i);
const on = !isUsed && picked === i;
return { name: isUsed ? name + ', used by another category' : name, checked: on ? 'true' : 'false', disabled: isUsed, pick: () => this.setState({ color: i }),
style: 'width: 38px; height: 38px; padding: 0; border-radius: 19px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: ' + (isUsed ? 'not-allowed' : 'pointer') + '; border: 2px solid ' + (on ? t.text : 'transparent'),
swatch: 'width: 26px; height: 26px; border-radius: 13px; background: ' + hex + (isUsed ? '; opacity: .25' : '') };
});
const hints = { VARIABLE: 'Spending that changes from month to month, like groceries or taxis.', FIXED: 'The same amount every month, like rent or subscriptions.', PERIODIC: 'Comes a few times a year, like insurance or gifts.' };
const colorNote = allTaken ? 'Every color is used by another category, so a new one can’t be created yet.' : 'Dimmed colors are used by other categories.';
const submitStyle = 'height: 48px; border: 0; border-radius: 14px; font-size: 15px; font-weight: 600; background: ' + t.text + '; color: ' + t.bg + (allTaken ? '; opacity: .4; cursor: not-allowed' : '');
return { t, kinds, colors, kindHint: hints[this.state.kind], colorNote, colorNoteColor: allTaken ? ((this.props.dark ?? true) ? '#FF7A6B' : '#B42318') : t.muted, allTaken, submitStyle };
}
}
</script>
</body>
</html>

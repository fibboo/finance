<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category picker dialog, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 24px; position: relative; overflow: hidden; display: flex; gap: 24px; font-family: Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{t.bg}}; color: {{t.text}}">
  <div style="width: 220px; flex-shrink: 0; border-radius: 20px; background: {{t.panel}}"></div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px">
    <span style="padding: 6px 8px 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Home</span>
    <div style="height: 200px; border-radius: 20px; background: {{t.panel}}"></div>
    <div style="flex-grow: 1; display: grid; grid-template-columns: 1fr 2fr; gap: 16px">
      <div style="border-radius: 20px; background: {{t.panel}}"></div>
      <div style="border-radius: 20px; background: {{t.panel}}"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.35)"></div>
  <div role="dialog" aria-modal="true" aria-labelledby="picker-title" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 440px; height: 600px; box-sizing: border-box; padding: 20px 24px 24px; border-radius: 20px; display: flex; flex-direction: column; gap: 12px; background: {{t.panel}}; box-shadow: 0 18px 50px rgba(0,0,0,.3)">
    <div style="height: 32px; display: flex; align-items: center; gap: 4px">
      <a href="form-desktop.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: {{t.muted}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></a>
      <h2 id="picker-title" style="margin: 0; font-size: 18px; font-weight: 600">Category</h2>
    </div>
    <label style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 8px; background: {{t.bg}}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" aria-label="Search categories" placeholder="Search or create" value="Coff" style="flex-grow: 1; min-width: 0; padding: 0; border: 0; outline: 0; background: transparent; font-size: 15px">
    </label>
    <div role="listbox" aria-label="Categories" style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column">
      <button type="button" style="min-height: 48px; padding: 0; border: 0; border-bottom: 1px solid {{t.line}}; background: transparent; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; color: {{t.accent}}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Create “Coff”</span>
      </button>
      <button type="button" role="option" aria-selected="false" style="min-height: 48px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; font-size: 15px; text-align: left">
        <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; background: #B8862C"></span>
        <span style="flex-grow: 1">Coffee to go</span>
        <span style="font-size: 12px; color: {{t.muted}}">Variable</span>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', accent: '#1F7A55', line: '#E2E2DE' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', accent: '#4CC38A', line: '#2A2D32' };
const t = (this.props.dark ?? true) ? D : L;
return { t };
}
}
</script>
</body>
</html>

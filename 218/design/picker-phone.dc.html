<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category picker, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 12px; font-family: Geist, system-ui, sans-serif; font-variant-numeric: tabular-nums; background: {{t.bg}}; color: {{t.text}}">
  <div style="padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Home</span>
    <span style="width: 44px; height: 44px; border-radius: 22px; background: {{t.panel}}"></span>
  </div>
  <div style="height: 160px; border-radius: 20px; background: {{t.panel}}"></div>
  <div style="flex-grow: 1; border-radius: 20px; background: {{t.panel}}"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.35)"></div>
  <div role="dialog" aria-modal="true" aria-labelledby="picker-title" style="position: absolute; left: 0; right: 0; bottom: 0; height: 800px; box-sizing: border-box; padding: 8px 16px 16px; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; gap: 12px; background: {{t.panel}}; box-shadow: 0 18px 50px rgba(0,0,0,.3)">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: {{t.line}}"></span>
    <div style="height: 32px; display: flex; align-items: center; gap: 4px">
      <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: {{t.muted}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></a>
      <h2 id="picker-title" style="margin: 0; font-size: 18px; font-weight: 600">Category</h2>
    </div>
    <label style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 8px; background: {{t.bg}}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" aria-label="Search categories" placeholder="Search or create" value="{{query}}" onInput="{{onQuery}}" style="flex-grow: 1; min-width: 0; padding: 0; border: 0; outline: 0; background: transparent; font-size: 15px">
    </label>
    <div role="listbox" aria-label="Categories" style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column">
      <sc-if value="{{canCreate}}" hint-placeholder-val="{{ true }}">
        <a href="create-category-phone.dc.html" style="min-height: 48px; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; color: {{t.accent}}; border-bottom: 1px solid {{t.line}}">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Create “{{query}}”</span>
        </a>
      </sc-if>
      <sc-for list="{{items}}" as="i" hint-placeholder-count="6">
        <button type="button" role="option" aria-selected="{{i.selected}}" onClick="{{i.pick}}" style="min-height: 48px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; font-size: 15px; text-align: left">
          <span aria-hidden="true" style="{{i.dot}}"></span>
          <span style="flex-grow: 1">{{i.name}}</span>
          <span style="font-size: 12px; color: {{t.muted}}">{{i.note}}</span>
          <sc-if value="{{i.isSelected}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.accent}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></sc-if>
        </button>
      </sc-for>
      <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}"><span style="padding: 12px 0; font-size: 13px; color: {{t.muted}}">No category matches “{{query}}”.</span></sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { query: 'Coff', picked: 'groceries' };
}
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', accent: '#1F7A55', line: '#E2E2DE' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', accent: '#4CC38A', line: '#2A2D32' };
const t = (this.props.dark ?? true) ? D : L;
const all = [['groceries', 'Groceries', 'Variable', '#2E8C7A'], ['coffee', 'Coffee to go', 'Variable', '#B8862C'], ['rent', 'Rent', 'Fixed', '#C2613F'], ['transport', 'Transport', 'Variable', '#4D8FBF'], ['subscriptions', 'Subscriptions', 'Fixed', '#8A6FD1'], ['insurance', 'Insurance', 'Periodic', '#A15CB8'], ['health', 'Health', 'Variable', '#C24E6E'], ['gifts', 'Gifts', 'Periodic', '#6E8A3A']];
const q = this.state.query.trim().toLowerCase();
const items = all.filter(([, name]) => name.toLowerCase().includes(q)).map(([id, name, note, c]) => ({ name, note,
dot: 'width:10px;height:10px;border-radius:3px;flex-shrink:0;background:' + c,
isSelected: this.state.picked === id, selected: this.state.picked === id ? 'true' : 'false',
pick: () => this.setState({ picked: id }) }));
const canCreate = q.length > 0 && !all.some(([, name]) => name.toLowerCase() === q);
return { t, query: this.state.query, items, canCreate, isEmpty: items.length === 0,
onQuery: (e) => this.setState({ query: e.target.value }) };
}
}
</script>
</body>
</html>

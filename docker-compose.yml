services:

  postgres:
    image: postgres:18
    command: [ "postgres", "-c", "log_statement=all" ]
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres

  backend:
    build:
      context: .
      dockerfile: ./tests/Dockerfile
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env

    command: uvicorn app.main:app --host 0.0.0.0 --reload

volumes:
  postgres:

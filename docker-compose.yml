services:

  postgres:
    image: postgres:18
    command: [ "postgres", "-c", "log_statement=all" ]
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - 'JSON_CONFIG={"interactiveLogin": true}'
    networks:
      default:
        aliases:
          - mock-oidc.localhost

  backend:
    build:
      context: ./backend
      dockerfile: ./tests/Dockerfile
    depends_on:
      - postgres
      - mock-oidc
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env

    command: uvicorn app.main:app --host 0.0.0.0 --reload

  frontend:
    image: node:26.12.0-alpine
    working_dir: /app
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

volumes:
  postgres:

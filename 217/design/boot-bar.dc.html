<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App loading — progress line</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.boot-run{animation:boot-run 1.3s cubic-bezier(.65,0,.35,1) infinite}
.boot-still{animation:none;transform:none;width:100%;opacity:.5}
@keyframes boot-run{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion: reduce){.boot-run{animation:none;transform:none;width:100%;opacity:.5}}
</style>
</helmet>
<div role="status" aria-label="Loading" style="width: 390px; height: 844px; display: flex; align-items: center; justify-content: center; font-family: Geist, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px">
    <div style="display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 24px; letter-spacing: -0.01em">
      <span style="width: 14px; height: 14px; border-radius: 4px; background: {{t.accent}}"></span>
      finance
    </div>
    <div style="width: 120px; height: 3px; border-radius: 2px; overflow: hidden; background: {{t.track}}">
      <div class="{{barClass}}" style="width: 40%; height: 100%; border-radius: 2px; background: {{t.accent}}"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"reducedMotion":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', text: '#17181A', accent: '#1F7A55', track: '#DCDCD7' };
const D = { bg: '#0B0C0E', text: '#ECEDEE', accent: '#4CC38A', track: '#24272B' };
const t = (this.props.dark ?? true) ? D : L;
return { t, barClass: 'boot-run' + (this.props.reducedMotion ? ' boot-still' : '') };
}
}
</script>
</body>
</html>

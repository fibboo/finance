<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home loading — block skeletons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
button{font:inherit;cursor:pointer}
.sk{display:block;background-repeat:no-repeat;background-size:200% 100%;animation:sk-shimmer 1.4s ease-in-out infinite}
.sk-light{background-image:linear-gradient(90deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.65) 50%,rgba(255,255,255,0) 70%)}
.sk-dark{background-image:linear-gradient(90deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.07) 50%,rgba(255,255,255,0) 70%)}
.sk-still{animation:none;background-image:none}
@keyframes sk-shimmer{from{background-position:150% 0}to{background-position:-50% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none;background-image:none}}
</style>
</helmet>
<div aria-busy="true" style="width: 390px; height: 1000px; box-sizing: border-box; padding: 16px 16px 104px; position: relative; display: flex; flex-direction: column; gap: 12px; font-family: Geist, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <div style="padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px">
      <span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.accent}}"></span>
      finance
    </div>
    <span aria-hidden="true" class="{{sk}}" style="width: 44px; height: 44px; border-radius: 22px; background-color: {{t.panel}}"></span>
  </div>
  <section aria-label="Balance" class="{{sk}}" style="height: 164px; border-radius: 20px; background-color: {{t.panel}}"></section>
  <section aria-label="Accounts" style="height: 246px; box-sizing: border-box; padding: 4px 16px 16px; border-radius: 20px; display: flex; flex-direction: column; background: {{t.panel}}">
    <div style="height: 42px; flex-shrink: 0; display: flex; align-items: center"><span style="font-size: 15px; font-weight: 600">Accounts</span></div>
    <span aria-hidden="true" class="{{sk}}" style="flex-grow: 1; border-radius: 14px; background-color: {{t.bone}}"></span>
  </section>
  <section aria-label="Recent transactions" style="height: 212px; box-sizing: border-box; padding: 8px 18px 16px; border-radius: 20px; display: flex; flex-direction: column; background: {{t.panel}}">
    <div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 15px; font-weight: 600">Recent</span><a href="#" style="font-size: 14px; color: {{t.muted}}">All</a></div>
    <span aria-hidden="true" class="{{sk}}" style="flex-grow: 1; border-radius: 14px; background-color: {{t.bone}}"></span>
  </section>
  <nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 16px; height: 68px; padding: 0 6px; border-radius: 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: {{t.panel}}; border: 1px solid {{t.line}}; box-shadow: 0 10px 30px rgba(0,0,0,.28)">
    <a href="#" aria-current="page" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: {{t.text}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>
      Home
    </a>
    <button type="button" disabled title="Soon" style="height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: {{t.muted}}; opacity: .5; cursor: not-allowed">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      Transactions
    </button>
    <button type="button" disabled aria-label="Add transaction (soon)" title="Soon" style="justify-self: center; width: 52px; height: 52px; border: 0; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: {{t.text}}; color: {{t.bg}}; opacity: .45; cursor: not-allowed">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" disabled title="Soon" style="height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: {{t.muted}}; opacity: .5; cursor: not-allowed">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>
      Accounts
    </button>
    <button type="button" disabled title="Soon" style="height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: {{t.muted}}; opacity: .5; cursor: not-allowed">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg>
      Categories
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"reducedMotion":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', line: '#E2E2DE', accent: '#1F7A55', bone: '#E4E4E0' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', line: '#2A2D32', accent: '#4CC38A', bone: '#24272B' };
const dark = this.props.dark ?? true;
const t = dark ? D : L;
const sk = 'sk ' + (dark ? 'sk-dark' : 'sk-light') + (this.props.reducedMotion ? ' sk-still' : '');
return { t, sk };
}
}
</script>
</body>
</html>

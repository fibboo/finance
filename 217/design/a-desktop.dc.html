<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home loading desktop — line skeletons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:.8}
button{font:inherit;cursor:pointer}
.sk{display:block;background-repeat:no-repeat;background-size:200% 100%;animation:sk-shimmer 1.4s ease-in-out infinite}
.sk-light{background-image:linear-gradient(90deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.65) 50%,rgba(255,255,255,0) 70%)}
.sk-dark{background-image:linear-gradient(90deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.07) 50%,rgba(255,255,255,0) 70%)}
.sk-still{animation:none;background-image:none}
@keyframes sk-shimmer{from{background-position:150% 0}to{background-position:-50% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none;background-image:none}}
</style>
</helmet>
<div aria-busy="true" style="min-height: 1000px; box-sizing: border-box; padding: 16px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; font-family: Geist, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <nav aria-label="Main" style="flex: 1 1 232px; max-width: 100%; box-sizing: border-box; padding: 16px 12px; border-radius: 22px; display: flex; flex-direction: column; gap: 4px; background: {{t.panel}}">
    <div style="height: 44px; padding: 0 10px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 18px">
      <span style="width: 10px; height: 10px; border-radius: 3px; background: {{t.accent}}"></span>
      finance
    </div>
    <button type="button" disabled title="Soon" style="height: 44px; margin-bottom: 10px; border: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; background: {{t.text}}; color: {{t.bg}}; opacity: .45; cursor: not-allowed">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add transaction
    </button>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
      <sc-if value="{{n.active}}" hint-placeholder-val="{{false}}">
        <a href="#" aria-current="page" style="height: 44px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; background: {{t.bg}}">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"/></svg>
          {{n.label}}
        </a>
      </sc-if>
      <sc-if value="{{n.soon}}" hint-placeholder-val="{{true}}">
        <button type="button" disabled style="height: 44px; padding: 0 12px; border: 0; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; background: transparent; color: {{t.muted}}; cursor: not-allowed">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="opacity: .55"><path d="{{n.icon}}"/></svg>
          <span style="opacity: .55">{{n.label}}</span>
          <span style="margin-left: auto; padding: 2px 8px; border-radius: 8px; font-size: 11px; background: {{t.bg}}">Soon</span>
        </button>
      </sc-if>
    </sc-for>
  </nav>
  <div style="flex: 999 1 560px; min-width: 0; max-width: 1180px; display: flex; flex-direction: column; gap: 16px">
    <div style="height: 76px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Home</h1>
      <span aria-hidden="true" class="{{sk}}" style="width: 44px; height: 44px; border-radius: 22px; background-color: {{t.panel}}"></span>
    </div>
    <section aria-label="Balance" style="padding: 24px 28px; border-radius: 22px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; background: {{t.panel}}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span aria-hidden="true" class="{{sk}}" style="width: 150px; height: 13px; border-radius: 6px; background-color: {{t.bone}}"></span>
        <span aria-hidden="true" class="{{sk}}" style="width: 320px; height: 50px; border-radius: 14px; background-color: {{t.bone}}"></span>
      </div>
      <div style="flex: 0 1 520px; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; color: {{t.muted}}">This month</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{tiles}}" as="x" hint-placeholder-count="3">
            <div style="height: 70px; box-sizing: border-box; padding: 12px 16px; border-radius: 14px; display: flex; flex-direction: column; justify-content: center; gap: 10px; background: {{t.bg}}">
              <span aria-hidden="true" class="{{sk}}" style="width: 52px; height: 11px; border-radius: 5px; background-color: {{t.bone}}"></span>
              <span aria-hidden="true" class="{{sk}}" style="width: 110px; height: 16px; border-radius: 7px; background-color: {{t.bone}}"></span>
            </div>
          </sc-for>
        </div>
      </div>
    </section>
    <section aria-label="Accounts" style="padding: 8px 20px 20px; border-radius: 22px; display: flex; flex-direction: column; gap: 4px; background: {{t.panel}}">
      <div style="height: 48px; padding: 0 8px; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 16px; font-weight: 600">Accounts</span><span aria-hidden="true" class="{{sk}}" style="width: 72px; height: 12px; border-radius: 6px; background-color: {{t.bone}}"></span></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); grid-template-rows: auto; grid-auto-rows: 0; column-gap: 10px; row-gap: 0; overflow: hidden">
        <sc-for list="{{cards}}" as="a" hint-placeholder-count="5">
          <div style="height: 108px; box-sizing: border-box; padding: 14px 16px; border-radius: 16px; display: flex; flex-direction: column; justify-content: space-between; background: {{t.bg}}">
            <span style="display: flex; align-items: center; gap: 10px">
              <span aria-hidden="true" class="{{sk}}" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px; background-color: {{t.bone}}"></span>
              <span style="display: flex; flex-direction: column; gap: 6px"><span aria-hidden="true" class="{{sk}}" style="width: {{a.name}}; height: 12px; border-radius: 6px; background-color: {{t.bone}}"></span><span aria-hidden="true" class="{{sk}}" style="width: 32px; height: 9px; border-radius: 5px; background-color: {{t.bone}}"></span></span>
            </span>
            <span style="display: flex; flex-direction: column; gap: 6px"><span aria-hidden="true" class="{{sk}}" style="width: {{a.amount}}; height: 16px; border-radius: 7px; background-color: {{t.bone}}"></span><span aria-hidden="true" class="{{sk}}" style="width: 64px; height: 9px; border-radius: 5px; background-color: {{t.bone}}"></span></span>
          </div>
        </sc-for>
      </div>
    </section>
    <section aria-label="Recent transactions" style="padding: 8px 28px 12px; border-radius: 22px; display: flex; flex-direction: column; background: {{t.panel}}">
      <div style="height: 48px; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 16px; font-weight: 600">Recent</span><a href="#" style="font-size: 14px; color: {{t.muted}}">All transactions</a></div>
      <sc-for list="{{recentRows}}" as="r" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 14px; height: 54px">
          <span aria-hidden="true" class="{{sk}}" style="width: 8px; height: 8px; flex-shrink: 0; border-radius: 4px; background-color: {{t.bone}}"></span>
          <span style="flex: 2 1 0; min-width: 0"><span aria-hidden="true" class="{{sk}}" style="width: {{r.title}}; height: 12px; border-radius: 6px; background-color: {{t.bone}}"></span></span>
          <span style="flex: 2 1 0; min-width: 0"><span aria-hidden="true" class="{{sk}}" style="width: {{r.account}}; height: 11px; border-radius: 5px; background-color: {{t.bone}}"></span></span>
          <span style="flex: 1 1 0; min-width: 0"><span aria-hidden="true" class="{{sk}}" style="width: 56px; height: 11px; border-radius: 5px; background-color: {{t.bone}}"></span></span>
          <span style="width: 120px; display: flex; justify-content: flex-end"><span aria-hidden="true" class="{{sk}}" style="width: {{r.amount}}; height: 12px; border-radius: 6px; background-color: {{t.bone}}"></span></span>
        </div>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"reducedMotion":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', panel: '#FFFFFF', text: '#17181A', muted: '#5A5D64', accent: '#1F7A55', bone: '#E4E4E0' };
const D = { bg: '#0B0C0E', panel: '#17191C', text: '#ECEDEE', muted: '#9A9EA6', accent: '#4CC38A', bone: '#24272B' };
const dark = this.props.dark ?? true;
const t = dark ? D : L;
const sk = 'sk ' + (dark ? 'sk-dark' : 'sk-light') + (this.props.reducedMotion ? ' sk-still' : '');
const tiles = [{}, {}, {}];
const cards = [['72px', '120px'], ['88px', '96px'], ['64px', '104px'], ['80px', '92px'], ['96px', '84px']].map(([name, amount]) => ({ name, amount }));
const recentRows = [['96px', '64px', '72px'], ['64px', '88px', '96px'], ['168px', '148px', '64px'], ['56px', '64px', '56px'], ['48px', '88px', '80px'], ['120px', '72px', '72px']].map(([title, account, amount]) => ({ title, account, amount }));
const nav = [
{ label: 'Home', icon: 'M4 11 12 4l8 7v9h-5v-6H9v6H4z', active: true },
{ label: 'Transactions', icon: 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01' },
{ label: 'Accounts', icon: 'M6 6h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3zM3 10h18M16 14.5h2' },
{ label: 'Categories', icon: 'M3 12V4h8l10 10-8 8zM7.5 8.5h.01' }
].map((n) => ({ ...n, active: !!n.active, soon: !n.active }));
return { t, sk, tiles, cards, recentRows, nav };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App loading — mark squares</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.boot-sq{animation:boot-step 1.2s ease-in-out infinite;opacity:.25}
.boot-sq-2{animation-delay:.2s}
.boot-sq-3{animation-delay:.4s}
.boot-still{animation:none;opacity:1}
@keyframes boot-step{0%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){.boot-sq{animation:none;opacity:1}}
</style>
</helmet>
<div role="status" aria-label="Loading" style="width: 390px; height: 844px; display: flex; align-items: center; justify-content: center; font-family: Geist, system-ui, sans-serif; background: {{t.bg}}; color: {{t.text}}">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
    <div style="display: flex; gap: 8px">
      <span class="{{sq1}}" style="width: 14px; height: 14px; border-radius: 4px; background: {{t.accent}}"></span>
      <span class="{{sq2}}" style="width: 14px; height: 14px; border-radius: 4px; background: {{t.accent}}"></span>
      <span class="{{sq3}}" style="width: 14px; height: 14px; border-radius: 4px; background: {{t.accent}}"></span>
    </div>
    <span style="font-weight: 600; font-size: 18px; letter-spacing: -0.01em; color: {{t.muted}}">finance</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"reducedMotion":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L = { bg: '#EEEEEB', text: '#17181A', muted: '#5A5D64', accent: '#1F7A55' };
const D = { bg: '#0B0C0E', text: '#ECEDEE', muted: '#9A9EA6', accent: '#4CC38A' };
const t = (this.props.dark ?? true) ? D : L;
const still = this.props.reducedMotion ? ' boot-still' : '';
return { t, sq1: 'boot-sq' + still, sq2: 'boot-sq boot-sq-2' + still, sq3: 'boot-sq boot-sq-3' + still };
}
}
</script>
</body>
</html>

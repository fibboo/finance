<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Issue 391 — варианты калькулятора</title><style>
*{box-sizing:border-box}body{margin:0;background:#24272b;color:#ecedee;font:15px/1.5 system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#17191c;padding:16px 24px;border-bottom:1px solid #41454d}h1{font-size:20px;margin:0 0 8px}p{margin:4px 0 16px;color:#bfc3ca}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:16px}label{display:flex;align-items:center;gap:8px}select,a{font:inherit;color:inherit;background:#24272b;border:1px solid #666b75;border-radius:8px;padding:9px 12px}a{text-decoration:none}a:hover{border-color:#4cc38a}main{padding:24px;overflow:auto}iframe{display:block;border:1px solid #666b75;border-radius:16px;background:#17191c;margin:auto}small{display:block;color:#bfc3ca;margin-top:12px}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #4cc38a;outline-offset:3px}
</style></head><body><header><h1>Issue #391 · Калькулятор суммы</h1><p>A — крупные клавиши в четыре колонки. B — компактная панель в пять колонок. Это макет: расчёт и клавиши пока не реализованы.</p><div class="controls"><label>Вариант <select id="variant"><option value="a">A · крупные клавиши</option><option value="b">B · компактный</option></select></label><label>Тема <select id="theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></label><label>Экран <select id="viewport"><option value="phone">Телефон · 390 × 844</option><option value="desktop">Компьютер · 1280 × 900</option></select></label><label>Контекст <select id="context"><option value="expense">Сумма операции</option><option value="filter">Фильтр суммы</option></select></label><label>Состояние <select id="state"><option value="valid">Результат</option><option value="error">Деление на ноль</option></select></label><a id="open" target="_blank" rel="noopener">Открыть макет отдельно ↗</a></div><small>Меняйте параметры сверху. На узком экране компьютерный макет можно прокручивать по горизонтали.</small></header><main><iframe id="frame" title="Предпросмотр калькулятора" width="390" height="844"></iframe></main><script>
const ids=['variant','theme','viewport','context','state'];function update(){const params=new URLSearchParams();for(const id of ids)params.set(id,document.getElementById(id).value);const url='index.html?'+params.toString();const frame=document.getElementById('frame');const desktop=document.getElementById('viewport').value==='desktop';frame.width=desktop?'1280':'390';frame.height=desktop?'900':'844';frame.src=url;document.getElementById('open').href=url;history.replaceState(null,'','?'+params.toString())}const initial=new URLSearchParams(location.search);for(const id of ids){const select=document.getElementById(id);if([...select.options].some(option=>option.value===initial.get(id)))select.value=initial.get(id);select.addEventListener('change',update)}update();
</script></body></html>
